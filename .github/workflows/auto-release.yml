name: Auto Release

on:
  push:
    branches: [main]
    paths:
      - 'Launcher/resource/Launcher.rc'
      - 'Mod/resource/Mod.rc'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.extract.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
      prev_tag: ${{ steps.check.outputs.prev_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version
        id: extract
        run: |
          extract_version() {
            iconv -f UTF-16LE -t UTF-8 "$1" 2>/dev/null | grep -oP 'FILEVERSION\s+\K\d+,\s*\d+,\s*\d+' | tr -d ' ' | tr ',' '.'
          }

          LAUNCHER_VER=$(extract_version "Launcher/resource/Launcher.rc" || echo "")
          MOD_VER=$(extract_version "Mod/resource/Mod.rc" || echo "")

          if [ -z "$LAUNCHER_VER" ] && [ -z "$MOD_VER" ]; then
            echo "::error::Failed to extract version from RC files"
            exit 1
          fi

          VERSION=$(printf '%s\n%s' "$LAUNCHER_VER" "$MOD_VER" | sort -V | tail -1)
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo "### Version: v$VERSION" >> $GITHUB_STEP_SUMMARY

      - name: Check tag exists
        id: check
        run: |
          VERSION="${{ steps.extract.outputs.version }}"

          if git tag -l "$VERSION" | grep -q .; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "Tag $VERSION already exists, skipping release" >> $GITHUB_STEP_SUMMARY
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          fi

  changelog:
    needs: version-check
    if: needs.version-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mod_changelog: ${{ steps.process.outputs.mod_changelog }}
      launcher_changelog: ${{ steps.process.outputs.launcher_changelog }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup previous version reference
        env:
          PREV_TAG: ${{ needs.version-check.outputs.prev_tag }}
        run: |
          # Create a directory with previous release code for comparison
          if [ -n "$PREV_TAG" ]; then
            git worktree add prev_release "$PREV_TAG"
          fi

      - name: Analyze commits
        env:
          PREV_TAG: ${{ needs.version-check.outputs.prev_tag }}
        run: |
          if [ -n "$PREV_TAG" ]; then
            git log "$PREV_TAG"..HEAD --pretty=format:"- %s" --no-merges > commits.txt
            git diff "$PREV_TAG"..HEAD -- 'Mod/**' 'Launcher/**' ':!Mod/SDK/**' > changes.diff
          else
            git log --pretty=format:"- %s" --no-merges -20 > commits.txt
            git diff HEAD~20..HEAD -- 'Mod/**' 'Launcher/**' ':!Mod/SDK/**' > changes.diff
          fi

      - name: Generate changelog
        id: ai_changelog
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            Generate a changelog for Half Sword Enhancer, a mod for the game Half Sword.
            Target audience: END USERS who are NOT programmers.

            ## AVAILABLE RESOURCES

            **Files to analyze:**
            - commits.txt - Commit messages since last release
            - changes.diff - Code diff since last release

            **For verification (if prev_release/ exists):**
            - prev_release/ - Contains the PREVIOUS RELEASE code (use to verify if something is truly "new")

            ## VERIFICATION WORKFLOW (MANDATORY)

            Before claiming ANY "new feature", you MUST:
            1. Check if the feature ALREADY EXISTS in prev_release/ (if available)
            2. Use Glob/Grep to search prev_release/ for the functionality
            3. Only call something "new" if it does NOT exist in prev_release/
            4. If it exists but was modified, describe what CHANGED, not that it's "new"

            ## ANTI-HALLUCINATION RULES (CRITICAL)

            1. **VERIFY before claiming "new"** - Always check prev_release/ first

            2. **NEVER infer features from infrastructure code**
               - Seeing manager/helper/utility code does NOT mean there's a user feature
               - Only report if you can trace: USER ACTION → VISIBLE RESULT

            3. **REAL HALLUCINATION EXAMPLES (never repeat these):**
               ❌ Saw ProcessRebindEvent() → Wrote "You can now rebind hotkeys"
                  (WRONG: Rebind code exists in previous release, no UI was added)
               ❌ Saw FunctionHashCache → Wrote "Faster menu"
                  (WRONG: Microsecond optimization, users won't notice)
               ❌ Saw ConfigTransaction refactor → Wrote "Improved settings saving"
                  (WRONG: Internal code cleanup, users see no difference)

            ## WHAT TO INCLUDE

            **Bug Fixes** (usually safe):
            - Crash fixes, input fixes, error handling that prevents issues

            **Improvements** (be careful):
            - Only if users would NOTICE the difference

            **New Features** (highest risk - verify against prev_release/):
            - MUST confirm it doesn't exist in prev_release/
            - MUST see complete user-facing implementation

            ## WHAT TO EXCLUDE

            - Refactoring, code reorganization
            - Internal classes/structs/functions
            - Preparation for future features
            - Features that already exist in previous release
            - Anything requiring guesswork

            ## OUTPUT FORMAT

            Return valid JSON:
            ```json
            {
              "mod": "changelog or empty string",
              "launcher": "changelog or empty string"
            }
            ```

            Use markdown headers: ## New Features, ## Bug Fixes, ## Improvements
            Write for gamers, avoid technical terms.
            Empty string "" for components with no user-facing changes.
            When in doubt, OMIT.
          claude_args: |
            --model claude-sonnet-4-5-20250929
            --allowedTools "Read,Glob,Grep,Bash(cat:*),Bash(head:*),Bash(ls:*)"
            --json-schema '{"type":"object","properties":{"mod":{"type":"string","description":"User-friendly changelog for Mod"},"launcher":{"type":"string","description":"User-friendly changelog for Launcher"}},"required":["mod","launcher"]}'
        continue-on-error: true

      - name: Process output
        id: process
        env:
          AI_OUTPUT: ${{ steps.ai_changelog.outputs.structured_output }}
        run: |
          if [ -n "$AI_OUTPUT" ] && echo "$AI_OUTPUT" | jq -e . >/dev/null 2>&1; then
            MOD_CL=$(echo "$AI_OUTPUT" | jq -r '.mod // empty')
            LAUNCHER_CL=$(echo "$AI_OUTPUT" | jq -r '.launcher // empty')
          else
            MOD_CL=""
            LAUNCHER_CL=""
          fi

          # Fallback to commit messages if AI failed
          if [ -z "$MOD_CL" ] && [ -z "$LAUNCHER_CL" ]; then
            MOD_CL=$(head -5 commits.txt)
            LAUNCHER_CL=$(head -5 commits.txt)
          fi

          { echo "mod_changelog<<EOF"; echo "$MOD_CL"; echo "EOF"; } >> $GITHUB_OUTPUT
          { echo "launcher_changelog<<EOF"; echo "$LAUNCHER_CL"; echo "EOF"; } >> $GITHUB_OUTPUT

      - name: Cleanup worktree
        if: always()
        run: git worktree remove prev_release --force 2>/dev/null || true

  build:
    needs: [version-check, changelog]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: microsoft/setup-msbuild@v2

      - name: Build and package
        shell: pwsh
        run: |
          MSBuild.exe "Half Sword Enhancer.sln" /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

          New-Item -ItemType Directory -Force -Path "release_files" | Out-Null
          Copy-Item "bin/HSEnhancerLauncher.exe" "release_files/"
          Copy-Item "bin/HSEnhancer.dll" "release_files/"

          New-Item -ItemType Directory -Force -Path "manual_install" | Out-Null
          Copy-Item "Manual_Install.txt" "manual_install/README.txt"
          Copy-Item "bin/dwmapi.dll" "manual_install/"
          Copy-Item "bin/HSEnhancer.dll" "manual_install/"
          Compress-Archive -Path "manual_install/*" -DestinationPath "release_files/HSEnhancer.zip" -Force

          "### Build Complete" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v6
        with:
          name: release-files
          path: release_files/
          retention-days: 1

  release:
    needs: [version-check, changelog, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.version-check.outputs.version }}
      MOD_CHANGELOG: ${{ needs.changelog.outputs.mod_changelog }}
      LAUNCHER_CHANGELOG: ${{ needs.changelog.outputs.launcher_changelog }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-files
          path: release_files/

      - name: Create release
        run: |
          {
            [ -n "$MOD_CHANGELOG" ] && printf "## Mod\n\n%s\n\n" "$MOD_CHANGELOG"
            [ -n "$LAUNCHER_CHANGELOG" ] && printf "## Launcher\n\n%s\n\n" "$LAUNCHER_CHANGELOG"
            echo "---"
            echo "See [README](https://github.com/${{ github.repository }}/blob/main/README.md#installation) for installation instructions."
          } > release_body.md

          gh release create "$VERSION" \
            --repo "${{ github.repository }}" \
            --title "$VERSION" \
            --notes-file release_body.md \
            release_files/*

name: Auto Release

on:
  push:
    branches: [main]
    paths:
      - 'Launcher/resource/Launcher.rc'
      - 'Mod/resource/Mod.rc'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.extract.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
      prev_tag: ${{ steps.check.outputs.prev_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version
        id: extract
        run: |
          extract_version() {
            iconv -f UTF-16LE -t UTF-8 "$1" 2>/dev/null | grep -oP 'FILEVERSION\s+\K\d+,\s*\d+,\s*\d+' | tr -d ' ' | tr ',' '.'
          }

          LAUNCHER_VER=$(extract_version "Launcher/resource/Launcher.rc" || echo "")
          MOD_VER=$(extract_version "Mod/resource/Mod.rc" || echo "")

          if [ -z "$LAUNCHER_VER" ] && [ -z "$MOD_VER" ]; then
            echo "::error::Failed to extract version from RC files"
            exit 1
          fi

          VERSION=$(printf '%s\n%s' "$LAUNCHER_VER" "$MOD_VER" | sort -V | tail -1)
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo "### Version: v$VERSION" >> $GITHUB_STEP_SUMMARY

      - name: Check tag exists
        id: check
        run: |
          VERSION="${{ steps.extract.outputs.version }}"

          if git tag -l "$VERSION" | grep -q .; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "Tag $VERSION already exists, skipping release" >> $GITHUB_STEP_SUMMARY
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          fi

  changelog:
    needs: version-check
    if: needs.version-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch dev changelog
        id: fetch_dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEV_BODY=$(gh release view dev-latest --repo "${{ github.repository }}" --json body -q '.body' 2>/dev/null || echo "")

          if [ -z "$DEV_BODY" ]; then
            echo "WARNING: No dev-latest release found. Cannot generate polished changelog."
            echo "has_dev_changelog=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          ACCUMULATED_CHANGELOG=$(echo "$DEV_BODY" | sed -n '/^> \[!WARNING\]/,/^## Installation$/p' | tail -n +4 | sed '$d')

          if [ -z "$ACCUMULATED_CHANGELOG" ]; then
            echo "WARNING: No accumulated changelog found in dev-latest."
            echo "has_dev_changelog=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_dev_changelog=true" >> $GITHUB_OUTPUT
          echo "$ACCUMULATED_CHANGELOG" > accumulated_changelog.txt

      - name: Polish changelog
        id: ai_changelog
        if: steps.fetch_dev.outputs.has_dev_changelog == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            <role>
            Create the changelog for a stable release of Half Sword Enhancer.
            </role>

            <task>
            Read accumulated_changelog.txt (dev build changelog) and consolidate it.
            </task>

            <rules>
            1. Merge related entries: "New X" + "Improved X UI" + "Fixed X crash" → "Added X"
            2. If something is new and improved in the same cycle, only show as new
            3. Remove duplicates and redundant entries
            4. Remove [Internal] changes unless they have user impact
            5. Group by feature area, one line per feature
            </rules>

            <format>
            ## New Features
            - [Category] Description

            ## Bug Fixes
            - [Category] Description

            ## Improvements
            - [Category] Description

            Categories: Spawner, Graphics, Player, Controls, Equipment, World, NPCs, Launcher, Mod
            Omit empty sections.
            </format>
          claude_args: |
            --model claude-opus-4-5-20251101
            --allowedTools "Read"
            --json-schema '{"type":"object","properties":{"changelog":{"type":"string","description":"Polished changelog for stable release"}},"required":["changelog"]}'

      - name: Process output
        id: process
        env:
          AI_OUTPUT: ${{ steps.ai_changelog.outputs.structured_output }}
          HAS_DEV: ${{ steps.fetch_dev.outputs.has_dev_changelog }}
        run: |
          if [ "$HAS_DEV" != "true" ]; then
            echo "ERROR: dev-latest release is required for stable release"
            exit 1
          fi

          if [ -n "$AI_OUTPUT" ] && echo "$AI_OUTPUT" | jq -e . >/dev/null 2>&1; then
            CHANGELOG=$(echo "$AI_OUTPUT" | jq -r '.changelog // empty')
          else
            echo "ERROR: AI output is empty or invalid"
            exit 1
          fi

          echo "$CHANGELOG" > polished_changelog.txt

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v6
        with:
          name: changelog-file
          path: polished_changelog.txt
          retention-days: 1

  build:
    needs: [version-check, changelog]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: microsoft/setup-msbuild@v2

      - name: Build and package
        shell: pwsh
        run: |
          MSBuild.exe "Half Sword Enhancer.sln" /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

          New-Item -ItemType Directory -Force -Path "release_files" | Out-Null
          Copy-Item "bin/HSEnhancerLauncher.exe" "release_files/"
          Copy-Item "bin/HSEnhancer.dll" "release_files/"

          New-Item -ItemType Directory -Force -Path "manual_install" | Out-Null
          Copy-Item "Manual_Install.txt" "manual_install/README.txt"
          Copy-Item "bin/dwmapi.dll" "manual_install/"
          Copy-Item "bin/HSEnhancer.dll" "manual_install/"
          Compress-Archive -Path "manual_install/*" -DestinationPath "release_files/HSEnhancer.zip" -Force

          "### Build Complete" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v6
        with:
          name: release-files
          path: release_files/
          retention-days: 1

  release:
    needs: [version-check, changelog, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.version-check.outputs.version }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-files
          path: release_files/

      - uses: actions/download-artifact@v7
        with:
          name: changelog-file
          path: changelog_files/

      - name: Create release
        run: |
          CHANGELOG=$(cat changelog_files/polished_changelog.txt 2>/dev/null || echo "")

          {
            [ -n "$CHANGELOG" ] && printf "%s\n\n" "$CHANGELOG"
            echo "---"
            echo "See [README](https://github.com/${{ github.repository }}/blob/main/README.md#installation) for installation instructions."
          } > release_body.md

          gh release create "$VERSION" \
            --repo "${{ github.repository }}" \
            --title "$VERSION" \
            --notes-file release_body.md \
            release_files/*

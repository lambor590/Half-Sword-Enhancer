name: Auto Release

on:
  push:
    branches: [main]
    paths:
      - 'Launcher/resource/Launcher.rc'
      - 'Mod/resource/Mod.rc'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.extract.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
      prev_tag: ${{ steps.check.outputs.prev_tag }}
      proxy_changed: ${{ steps.check.outputs.proxy_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version
        id: extract
        run: |
          ver() { iconv -f UTF-16LE -t UTF-8 "$1" 2>/dev/null | grep -oP 'FILEVERSION\s+\K\d+,\s*\d+,\s*\d+' | tr -d ' ' | tr ',' '.'; }
          VER=$(printf '%s\n%s' "$(ver Launcher/resource/Launcher.rc)" "$(ver Mod/resource/Mod.rc)" | sort -V | tail -1)
          [ -z "$VER" ] && echo "::error::Failed to extract version" && exit 1
          echo "version=v$VER" >> $GITHUB_OUTPUT
          echo "### Version: v$VER" >> $GITHUB_STEP_SUMMARY

      - name: Check tag exists
        id: check
        run: |
          VERSION="${{ steps.extract.outputs.version }}"
          if git rev-parse "$VERSION" &>/dev/null; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "Tag $VERSION exists, skipping" >> $GITHUB_STEP_SUMMARY
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null)
            echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
            if [ -n "$PREV_TAG" ]; then
              PROXY_CHANGED=$(git diff --quiet "$PREV_TAG"..HEAD -- 'Proxy/**' && echo false || echo true)
            else
              PROXY_CHANGED=true
            fi
            echo "proxy_changed=$PROXY_CHANGED" >> $GITHUB_OUTPUT
          fi

  changelog:
    needs: version-check
    if: needs.version-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch experimental changelog
        id: fetch_experimental
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXPERIMENTAL_BODY=$(gh release view experimental-latest --repo "${{ github.repository }}" --json body -q '.body' 2>/dev/null) || true
          CHANGELOG=$(echo "$EXPERIMENTAL_BODY" | sed -n '/^> \[!WARNING\]/,/^## Installation/p' | tail -n +4 | sed '$d')

          if [ -z "$CHANGELOG" ]; then
            echo "WARNING: No experimental changelog found"
            echo "has_experimental_changelog=false" >> $GITHUB_OUTPUT
          else
            echo "has_experimental_changelog=true" >> $GITHUB_OUTPUT
            echo "$CHANGELOG" > accumulated_changelog.txt
          fi

      - name: Validate changelog
        env:
          HAS_EXPERIMENTAL: ${{ steps.fetch_experimental.outputs.has_experimental_changelog }}
        run: |
          [ "$HAS_EXPERIMENTAL" != "true" ] && echo "ERROR: experimental-latest required" && exit 1
          cp accumulated_changelog.txt changelog.txt

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v6
        with:
          name: changelog-file
          path: changelog.txt
          retention-days: 1

  build:
    needs: [version-check, changelog]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install VS 2026 Build Tools
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/18/stable/vs_buildtools.exe" -OutFile vs_buildtools.exe
          $process = Start-Process -Wait -PassThru -FilePath .\vs_buildtools.exe -ArgumentList "--quiet","--wait","--norestart","--nocache","--add","Microsoft.VisualStudio.Workload.VCTools","--includeRecommended"
          $exitCode = $process.ExitCode
          Write-Host "vs_buildtools.exe exited with code $exitCode"
          if ($exitCode -eq 3010) { Write-Host "Reboot requested - continuing" }
          elseif ($exitCode -ne 0) { throw "VS 2026 Build Tools installation failed (exit code $exitCode)" }

      - uses: microsoft/setup-msbuild@v2

      - name: Build and package
        shell: pwsh
        env:
          PROXY_CHANGED: ${{ needs.version-check.outputs.proxy_changed }}
        run: |
          MSBuild.exe "Half Sword Enhancer.sln" /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

          New-Item -ItemType Directory -Force -Path "release_files" | Out-Null
          Copy-Item "bin/HSEnhancerLauncher.exe" "release_files/"
          Copy-Item "bin/HSEnhancer.dll" "release_files/"
          if ($env:PROXY_CHANGED -eq "true") {
            Copy-Item "bin/winmm.dll" "release_files/"
          }

          New-Item -ItemType Directory -Force -Path "manual_install" | Out-Null
          Copy-Item "Manual_Install.txt" "manual_install/README.txt"
          Copy-Item "bin/winmm.dll" "manual_install/"
          Copy-Item "bin/HSEnhancer.dll" "manual_install/"
          Compress-Archive -Path "manual_install/*" -DestinationPath "release_files/HSEnhancer.zip" -Force

          "### Build Complete" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v6
        with:
          name: release-files
          path: release_files/
          retention-days: 1

  release:
    needs: [version-check, changelog, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.version-check.outputs.version }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-files
          path: release_files/

      - uses: actions/download-artifact@v7
        with:
          name: changelog-file
          path: changelog_files/

      - name: Create release
        run: |
          {
            cat changelog_files/changelog.txt 2>/dev/null
            echo -e "\n---"
            echo "See [README](https://github.com/${{ github.repository }}#installation) for installation instructions."
          } > release_body.md

          gh release create "$VERSION" --repo "${{ github.repository }}" --title "$VERSION" --draft --notes-file release_body.md release_files/*

      - name: Reset experimental changelog
        run: |
          gh release edit experimental-latest --repo "${{ github.repository }}" --notes "$(cat <<'EOF'
          > [!WARNING]
          > **Experimental Build** — May contain bugs or incomplete features

          *No changes since ${{ env.VERSION }}*

          ## Installation

          Download and run `HSEnhancerLauncher.exe` — it will automatically install and update the mod.
          EOF
          )" || echo "WARNING: Could not reset experimental-latest changelog"

name: Auto Release

on:
  push:
    branches: [main]
    paths:
      - 'Launcher/resource/Launcher.rc'
      - 'Mod/resource/Mod.rc'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.extract.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
      prev_tag: ${{ steps.check.outputs.prev_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version
        id: extract
        run: |
          extract_version() {
            iconv -f UTF-16LE -t UTF-8 "$1" 2>/dev/null | grep -oP 'FILEVERSION\s+\K\d+,\s*\d+,\s*\d+' | tr -d ' ' | tr ',' '.'
          }

          LAUNCHER_VER=$(extract_version "Launcher/resource/Launcher.rc" || echo "")
          MOD_VER=$(extract_version "Mod/resource/Mod.rc" || echo "")

          if [ -z "$LAUNCHER_VER" ] && [ -z "$MOD_VER" ]; then
            echo "::error::Failed to extract version from RC files"
            exit 1
          fi

          VERSION=$(printf '%s\n%s' "$LAUNCHER_VER" "$MOD_VER" | sort -V | tail -1)
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo "### Version: v$VERSION" >> $GITHUB_STEP_SUMMARY

      - name: Check tag exists
        id: check
        run: |
          VERSION="${{ steps.extract.outputs.version }}"

          if git tag -l "$VERSION" | grep -q .; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "Tag $VERSION already exists, skipping release" >> $GITHUB_STEP_SUMMARY
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          fi

  changelog:
    needs: version-check
    if: needs.version-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mod_changelog: ${{ steps.process.outputs.mod_changelog }}
      launcher_changelog: ${{ steps.process.outputs.launcher_changelog }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Analyze commits
        env:
          PREV_TAG: ${{ needs.version-check.outputs.prev_tag }}
        run: |
          if [ -n "$PREV_TAG" ]; then
            git log "$PREV_TAG"..HEAD --pretty=format:"- %s" --no-merges > commits.txt
            git diff "$PREV_TAG"..HEAD -- '*.cpp' '*.h' '*.hpp' ':!Mod/SDK/**' | head -c 100000 > changes.diff
          else
            git log --pretty=format:"- %s" --no-merges -20 > commits.txt
            git diff HEAD~20..HEAD -- '*.cpp' '*.h' '*.hpp' ':!Mod/SDK/**' | head -c 100000 > changes.diff
          fi

      - name: Generate changelog
        id: ai_changelog
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            Generate changelogs for Half Sword Enhancer, a C++ mod for the Unreal Engine 5 game Half Sword.

            **Input Files:**
            1. commits.txt - Recent commit messages
            2. changes.diff - Code diff (max 100KB)

            **Output Requirements:**
            Return valid JSON with this exact structure:
            {
              "mod": "- Feature X\n- Bug fix Y",
              "launcher": "- Update improvement"
            }

            **Writing Style:**
            Write for gamers who mod their games but aren't programmers. Each entry should:
            - Lead with the user benefit or observable change
            - Include brief technical context in parentheses when helpful
            - Be one line, concise but complete

            Good examples:
            - "Search items by name in Entity Spawner (new filter input)"
            - "Rebind hotkeys through a new settings menu"
            - "Fixed keyboard not responding when menu is open (input capture fix)"
            - "Faster menu opening (reduced DirectX hook overhead)"
            - "Fixed occasional crash when spawning many entities (memory management)"

            Bad examples (too technical):
            - "Implemented compile-time FNV-1a hashing for ProcessEvent hooks"
            - "Refactored ConfigManager to use std::string_view"
            - "Replaced TMap with constexpr std::array for actor lookups"

            Bad examples (too vague):
            - "Performance improvements"
            - "Bug fixes"
            - "Code cleanup"

            **Rules:**
            1. Only include components (mod/launcher) with actual changes
            2. Each entry starts with "- "
            3. Group related changes into single entries when logical
            4. Omit purely internal refactors that don't affect users
            5. Empty string "" for components with no user-facing changes
            6. For launcher: focus on update system, injection, and startup behavior
            7. For mod: focus on gameplay features, GUI, keybinds, and performance
          claude_args: |
            --model claude-sonnet-4-5-20250929
            --allowedTools "Read,Bash(cat:*),Bash(head:*)"
            --json-schema '{"type":"object","properties":{"mod":{"type":"string","description":"Changelog for Mod component"},"launcher":{"type":"string","description":"Changelog for Launcher component"}},"required":["mod","launcher"]}'
        continue-on-error: true

      - name: Process output
        id: process
        env:
          AI_OUTPUT: ${{ steps.ai_changelog.outputs.structured_output }}
        run: |
          if [ -n "$AI_OUTPUT" ] && echo "$AI_OUTPUT" | jq -e . >/dev/null 2>&1; then
            MOD_CL=$(echo "$AI_OUTPUT" | jq -r '.mod // empty')
            LAUNCHER_CL=$(echo "$AI_OUTPUT" | jq -r '.launcher // empty')
          else
            MOD_CL=""
            LAUNCHER_CL=""
          fi

          # Fallback to commit messages if AI failed
          if [ -z "$MOD_CL" ] && [ -z "$LAUNCHER_CL" ]; then
            MOD_CL=$(head -5 commits.txt)
            LAUNCHER_CL=$(head -5 commits.txt)
          fi

          { echo "mod_changelog<<EOF"; echo "$MOD_CL"; echo "EOF"; } >> $GITHUB_OUTPUT
          { echo "launcher_changelog<<EOF"; echo "$LAUNCHER_CL"; echo "EOF"; } >> $GITHUB_OUTPUT

  build:
    needs: [version-check, changelog]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: microsoft/setup-msbuild@v2

      - name: Build and package
        shell: pwsh
        run: |
          MSBuild.exe "Half Sword Enhancer.sln" /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

          New-Item -ItemType Directory -Force -Path "release_files" | Out-Null
          Copy-Item "bin/HSEnhancerLauncher.exe" "release_files/"
          Copy-Item "bin/HSEnhancer.dll" "release_files/"

          New-Item -ItemType Directory -Force -Path "manual_install" | Out-Null
          Copy-Item "Manual_Install.txt" "manual_install/README.txt"
          Copy-Item "bin/dwmapi.dll" "manual_install/"
          Copy-Item "bin/HSEnhancer.dll" "manual_install/"
          Compress-Archive -Path "manual_install/*" -DestinationPath "release_files/HSEnhancer.zip" -Force

          "### Build Complete" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v6
        with:
          name: release-files
          path: release_files/
          retention-days: 1

  release:
    needs: [version-check, changelog, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.version-check.outputs.version }}
      MOD_CHANGELOG: ${{ needs.changelog.outputs.mod_changelog }}
      LAUNCHER_CHANGELOG: ${{ needs.changelog.outputs.launcher_changelog }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-files
          path: release_files/

      - name: Create release
        run: |
          {
            [ -n "$MOD_CHANGELOG" ] && printf "## Mod\n\n%s\n\n" "$MOD_CHANGELOG"
            [ -n "$LAUNCHER_CHANGELOG" ] && printf "## Launcher\n\n%s\n\n" "$LAUNCHER_CHANGELOG"
            echo "---"
            echo "See [README](https://github.com/${{ github.repository }}/blob/main/README.md#installation) for installation instructions."
          } > release_body.md

          gh release create "$VERSION" \
            --repo "${{ github.repository }}" \
            --title "$VERSION" \
            --notes-file release_body.md \
            release_files/*

name: Auto Release

on:
  push:
    branches: [main]
    paths:
      - 'Launcher/resource/Launcher.rc'
      - 'Mod/resource/Mod.rc'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.extract.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
      prev_tag: ${{ steps.check.outputs.prev_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version
        id: extract
        run: |
          extract_version() {
            iconv -f UTF-16LE -t UTF-8 "$1" 2>/dev/null | grep -oP 'FILEVERSION\s+\K\d+,\s*\d+,\s*\d+' | tr -d ' ' | tr ',' '.'
          }

          LAUNCHER_VER=$(extract_version "Launcher/resource/Launcher.rc" || echo "")
          MOD_VER=$(extract_version "Mod/resource/Mod.rc" || echo "")

          if [ -z "$LAUNCHER_VER" ] && [ -z "$MOD_VER" ]; then
            echo "::error::Failed to extract version from RC files"
            exit 1
          fi

          VERSION=$(printf '%s\n%s' "$LAUNCHER_VER" "$MOD_VER" | sort -V | tail -1)
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo "### Version: v$VERSION" >> $GITHUB_STEP_SUMMARY

      - name: Check tag exists
        id: check
        run: |
          VERSION="${{ steps.extract.outputs.version }}"

          if git tag -l "$VERSION" | grep -q .; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "Tag $VERSION already exists, skipping release" >> $GITHUB_STEP_SUMMARY
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          fi

  changelog:
    needs: version-check
    if: needs.version-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mod_changelog: ${{ steps.process.outputs.mod_changelog }}
      launcher_changelog: ${{ steps.process.outputs.launcher_changelog }}
      technical_changelog: ${{ steps.process.outputs.technical_changelog }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Analyze commits
        env:
          PREV_TAG: ${{ needs.version-check.outputs.prev_tag }}
        run: |
          if [ -n "$PREV_TAG" ]; then
            git log "$PREV_TAG"..HEAD --pretty=format:"- %s" --no-merges > commits.txt
            git diff "$PREV_TAG"..HEAD -- '*.cpp' '*.h' '*.hpp' ':!Mod/SDK/**' | head -c 100000 > changes.diff
          else
            git log --pretty=format:"- %s" --no-merges -20 > commits.txt
            git diff HEAD~20..HEAD -- '*.cpp' '*.h' '*.hpp' ':!Mod/SDK/**' | head -c 100000 > changes.diff
          fi

      - name: Generate changelog
        id: ai_changelog
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            Generate a changelog for Half Sword Enhancer, a mod for the game Half Sword.

            **Input Files:**
            1. commits.txt - Recent commit messages
            2. changes.diff - Code diff (max 100KB)

            **CRITICAL: Only include changes that are EXPLICITLY shown in the input files.**
            - Do NOT invent features or fixes that don't appear in commits.txt or changes.diff
            - Do NOT assume what a feature does beyond what the code shows
            - If unsure about a change, omit it rather than guess
            - Read the actual diff to understand what changed

            **Output Requirements:**
            Return valid JSON with THREE sections:
            {
              "mod": "* User-facing change",
              "launcher": "* User-facing change",
              "technical": "* Internal change"
            }

            **SECTION 1 & 2: mod / launcher (User-facing)**
            Format:
            - Main entries: `* ` prefix
            - Sub-details: `  * ` (two spaces) - max 1 per entry, only if essential
            - Use backticks for feature names: `Clear Objects`, `Entity Spawner`

            **BE CONCISE:**
            - One sub-bullet MAX per entry
            - Don't explain obvious behavior
            - No technical jargon (DirectX, swap chain, memory) - those go in technical section

            **SECTION 3: technical (Developer-facing)**
            For programmers. Simple bullets, one line each.

            **Rules:**
            1. ONLY include changes visible in the provided files
            2. Empty string "" for sections with no changes
            3. When in doubt, OMIT the entry
            4. CONCISE - fewer accurate entries is better than many guessed ones
          claude_args: |
            --model claude-sonnet-4-5-20250929
            --allowedTools "Read,Bash(cat:*),Bash(head:*)"
            --json-schema '{"type":"object","properties":{"mod":{"type":"string","description":"Changelog for Mod component"},"launcher":{"type":"string","description":"Changelog for Launcher component"},"technical":{"type":"string","description":"Technical changes for developers"}},"required":["mod","launcher","technical"]}'
        continue-on-error: true

      - name: Process output
        id: process
        env:
          AI_OUTPUT: ${{ steps.ai_changelog.outputs.structured_output }}
        run: |
          if [ -n "$AI_OUTPUT" ] && echo "$AI_OUTPUT" | jq -e . >/dev/null 2>&1; then
            MOD_CL=$(echo "$AI_OUTPUT" | jq -r '.mod // empty')
            LAUNCHER_CL=$(echo "$AI_OUTPUT" | jq -r '.launcher // empty')
            TECH_CL=$(echo "$AI_OUTPUT" | jq -r '.technical // empty')
          else
            MOD_CL=""
            LAUNCHER_CL=""
            TECH_CL=""
          fi

          # Fallback to commit messages if AI failed
          if [ -z "$MOD_CL" ] && [ -z "$LAUNCHER_CL" ]; then
            MOD_CL=$(head -5 commits.txt)
            LAUNCHER_CL=$(head -5 commits.txt)
          fi

          { echo "mod_changelog<<EOF"; echo "$MOD_CL"; echo "EOF"; } >> $GITHUB_OUTPUT
          { echo "launcher_changelog<<EOF"; echo "$LAUNCHER_CL"; echo "EOF"; } >> $GITHUB_OUTPUT
          { echo "technical_changelog<<EOF"; echo "$TECH_CL"; echo "EOF"; } >> $GITHUB_OUTPUT

  build:
    needs: [version-check, changelog]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: microsoft/setup-msbuild@v2

      - name: Build and package
        shell: pwsh
        run: |
          MSBuild.exe "Half Sword Enhancer.sln" /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

          New-Item -ItemType Directory -Force -Path "release_files" | Out-Null
          Copy-Item "bin/HSEnhancerLauncher.exe" "release_files/"
          Copy-Item "bin/HSEnhancer.dll" "release_files/"

          New-Item -ItemType Directory -Force -Path "manual_install" | Out-Null
          Copy-Item "Manual_Install.txt" "manual_install/README.txt"
          Copy-Item "bin/dwmapi.dll" "manual_install/"
          Copy-Item "bin/HSEnhancer.dll" "manual_install/"
          Compress-Archive -Path "manual_install/*" -DestinationPath "release_files/HSEnhancer.zip" -Force

          "### Build Complete" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v6
        with:
          name: release-files
          path: release_files/
          retention-days: 1

  release:
    needs: [version-check, changelog, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.version-check.outputs.version }}
      MOD_CHANGELOG: ${{ needs.changelog.outputs.mod_changelog }}
      LAUNCHER_CHANGELOG: ${{ needs.changelog.outputs.launcher_changelog }}
      TECHNICAL_CHANGELOG: ${{ needs.changelog.outputs.technical_changelog }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-files
          path: release_files/

      - name: Create release
        run: |
          {
            [ -n "$MOD_CHANGELOG" ] && printf "## Mod\n\n%s\n\n" "$MOD_CHANGELOG"
            [ -n "$LAUNCHER_CHANGELOG" ] && printf "## Launcher\n\n%s\n\n" "$LAUNCHER_CHANGELOG"
            if [ -n "$TECHNICAL_CHANGELOG" ]; then
              echo "<details>"
              echo "<summary><b>Technical Details</b></summary>"
              echo ""
              echo "$TECHNICAL_CHANGELOG"
              echo ""
              echo "</details>"
              echo ""
            fi
            echo "---"
            echo "See [README](https://github.com/${{ github.repository }}/blob/main/README.md#installation) for installation instructions."
          } > release_body.md

          gh release create "$VERSION" \
            --repo "${{ github.repository }}" \
            --title "$VERSION" \
            --notes-file release_body.md \
            release_files/*

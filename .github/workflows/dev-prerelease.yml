name: Dev Pre-Release

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [main]
    paths: ['Mod/**', 'Launcher/**', 'Proxy/**', 'ext/**']

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mod_changed: ${{ steps.analyze.outputs.mod_changed }}
      launcher_changed: ${{ steps.analyze.outputs.launcher_changed }}
      changelog: ${{ steps.process.outputs.changelog }}
      current_commit: ${{ steps.analyze.outputs.current_commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Analyze changes
        id: analyze
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch all refs to ensure LAST_NOTIFIED_COMMIT is available
          git fetch origin --quiet

          # Get last notified commit for incremental changelog
          LAST_NOTIFIED=$(gh release view dev-latest --repo "${{ github.repository }}" --json body -q '.body' 2>/dev/null | \
            grep -oP '<!-- LAST_NOTIFIED_COMMIT: \K[a-f0-9]+(?= -->)' || echo "")

          # Determine base reference for changelog (what's new since last notification)
          if [ -n "$LAST_NOTIFIED" ] && git cat-file -e "$LAST_NOTIFIED" 2>/dev/null; then
            BASE_REF="$LAST_NOTIFIED"
          else
            BASE_REF="origin/main"
          fi

          # Detect changes using unified BASE_REF
          MOD_CHANGED=$(git diff --name-only "$BASE_REF"..HEAD -- 'Mod/**' 'Proxy/**' 'ext/**' | grep -q . && echo true || echo false)
          LAUNCHER_CHANGED=$(git diff --name-only "$BASE_REF"..HEAD -- 'Launcher/**' 'ext/**' | grep -q . && echo true || echo false)

          echo "mod_changed=$MOD_CHANGED" >> $GITHUB_OUTPUT
          echo "launcher_changed=$LAUNCHER_CHANGED" >> $GITHUB_OUTPUT
          echo "current_commit=${{ github.sha }}" >> $GITHUB_OUTPUT

          # Generate commits with hash for correlation
          git log "$BASE_REF"..HEAD --pretty=format:"- %h: %s" --no-merges \
            -- 'Mod/**' 'Launcher/**' 'Proxy/**' 'ext/**' ':!Mod/SDK/**' > commits.txt

          # Detect large files (>500 lines changed) for exclusion
          LARGE_FILES=$(git diff "$BASE_REF"..HEAD --numstat -- 'Mod/**' 'Launcher/**' 'Proxy/**' 'ext/**' | \
            awk '$1+$2 > 500 {print ":!" $3}')

          # Generate diff with hash markers
          git log "$BASE_REF"..HEAD --no-merges --format=$'\\n=== %h ===' -p \
            -- 'Mod/**' 'Launcher/**' 'Proxy/**' 'ext/**' \
            ':!Mod/SDK/**' ':!*.vcxproj*' ':!*.rc' ':!*.filters' \
            $LARGE_FILES > changes.diff

          # Export commits as JSON string
          echo "commits_content=$(cat commits.txt 2>/dev/null | jq -Rs . || echo '""')" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: ai_changelog
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            <context>
            Generate a changelog for Half Sword Enhancer, a mod for the medieval combat game Half Sword.
            The mod adds an in-game menu (INSERT key) with spawn controls, equipment management, and gameplay tweaks.
            Audience: gamers. Write like patch notes, not code documentation.
            </context>

            <commits>
            ${{ fromJSON(steps.analyze.outputs.commits_content) }}
            </commits>

            <resources>
            - changes.diff: diff with `=== hash ===` markers (search by hash from commits above)
            - Use Bash with `git show origin/main:path/to/file` to see previous version
            </resources>

            <process>
            STEP 1 - COLLECT: Review commits above (format: `- hash: message`). List user-facing changes.
            STEP 2 - VERIFY: Use Grep to search changes.diff for `=== hash ===` to see the actual code.
            STEP 3 - COMPARE: Use `git show origin/main:path` to understand what specifically changed.
              - If feature existed before: describe only what's new (not the whole feature)
              - Example: "auto-update" existed → "dev-to-dev updates" is new → write about dev-to-dev only
            STEP 4 - CATEGORIZE: Assign to one section only. Choose the most relevant.

            IMPORTANT: Only include changes verified in changes.diff. Omit infrastructure/refactors.
            </process>

            <categories>
            ## New Features
            Completely new functionality. Use **bold subcategories** to group related items.

            ## Bug Fixes
            ONLY crashes, errors, or completely broken functionality.

            ## Improvements
            Enhancements to existing features, better UX, or performance gains.
            </categories>

            <writing_style>
            Describe what the USER experiences, not how it's implemented.
            Translate technical terms to user impact.
            Bad: "Fixed DirectX swap chain creation failure"
            Good: "Fixed rare startup crash on some graphics cards"
            </writing_style>

            <output>
            - Use ## headers with **bold subcategories** when grouping 2+ related items
            - Each change in one section only. Never duplicate across sections.
            - Combine commits affecting the same feature into one bullet.
            - Omit empty sections. Return empty string if no user-facing changes.
            </output>
          claude_args: |
            --model claude-opus-4-5-20251101
            --allowedTools "Read,Glob,Grep,Task,Bash(cat:*),Bash(head:*),Bash(ls:*)"
            --json-schema '{"type":"object","properties":{"changelog":{"type":"string"}},"required":["changelog"]}'
        continue-on-error: true

      - name: Process output
        id: process
        env:
          AI_OUTPUT: ${{ steps.ai_changelog.outputs.structured_output }}
        run: |
          if [ -n "$AI_OUTPUT" ] && echo "$AI_OUTPUT" | jq -e . >/dev/null 2>&1; then
            CHANGELOG=$(echo "$AI_OUTPUT" | jq -r '.changelog // empty')
          else
            CHANGELOG=""
          fi

          # Fallback: process conventional commits to user-friendly format
          if [ -z "$CHANGELOG" ] && [ -f commits.txt ]; then
            CHANGELOG=$(grep -E '^- [a-f0-9]+: (feat|fix|perf):' commits.txt | head -5 | \
              sed -E 's/^- [a-f0-9]+: feat(\([^)]*\))?: /- Added: /;
                      s/^- [a-f0-9]+: fix(\([^)]*\))?: /- Fixed: /;
                      s/^- [a-f0-9]+: perf(\([^)]*\))?: /- Improved: /')
            [ -z "$CHANGELOG" ] && CHANGELOG=$(head -5 commits.txt | sed 's/^- [a-f0-9]*: /- /')
          fi

          { echo "changelog<<EOF"; echo "$CHANGELOG"; echo "EOF"; } >> $GITHUB_OUTPUT

  build:
    needs: changelog
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: microsoft/setup-msbuild@v2

      - name: Build Mod and Proxy
        if: needs.changelog.outputs.mod_changed == 'true'
        shell: pwsh
        run: |
          MSBuild.exe "Mod/Mod.vcxproj" /p:Configuration="Release Dev" /p:Platform=x64 /p:PlatformToolset=v143 /p:SolutionDir="$PWD/"
          if ($LASTEXITCODE -ne 0) { throw "Mod build failed" }
          MSBuild.exe "Proxy/Proxy.vcxproj" /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:SolutionDir="$PWD/"
          if ($LASTEXITCODE -ne 0) { throw "Proxy build failed" }

      - name: Build Launcher
        if: needs.changelog.outputs.launcher_changed == 'true'
        shell: pwsh
        run: |
          MSBuild.exe "Launcher/Launcher.vcxproj" /p:Configuration="Release Dev" /p:Platform=x64 /p:PlatformToolset=v143 /p:SolutionDir="$PWD/"
          if ($LASTEXITCODE -ne 0) { throw "Launcher build failed" }

      - name: Package
        shell: pwsh
        env:
          MOD_CHANGED: ${{ needs.changelog.outputs.mod_changed }}
          LAUNCHER_CHANGED: ${{ needs.changelog.outputs.launcher_changed }}
        run: |
          New-Item -ItemType Directory -Force -Path "release_files" | Out-Null

          if ($env:MOD_CHANGED -eq "true") {
            Copy-Item "bin/HSEnhancer.dll" "release_files/"
            New-Item -ItemType Directory -Force -Path "manual_install" | Out-Null
            Copy-Item "Manual_Install.txt" "manual_install/README.txt"
            Copy-Item "bin/dwmapi.dll" "manual_install/"
            Copy-Item "bin/HSEnhancer.dll" "manual_install/"
            Compress-Archive -Path "manual_install/*" -DestinationPath "release_files/HSEnhancer.zip" -Force
          }

          if ($env:LAUNCHER_CHANGED -eq "true") {
            Copy-Item "bin/HSEnhancerLauncherDev.exe" "release_files/HSEnhancerLauncher.exe"
          }

      - uses: actions/upload-artifact@v6
        if: needs.changelog.outputs.mod_changed == 'true' || needs.changelog.outputs.launcher_changed == 'true'
        with:
          name: release-files
          path: release_files/
          retention-days: 1

  release:
    needs: [changelog, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MOD_CHANGED: ${{ needs.changelog.outputs.mod_changed }}
      LAUNCHER_CHANGED: ${{ needs.changelog.outputs.launcher_changed }}
      CHANGELOG: ${{ needs.changelog.outputs.changelog }}
      CURRENT_COMMIT: ${{ needs.changelog.outputs.current_commit }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-files
          path: release_files/

      - name: Publish release
        run: |
          # Extract existing changelog from release body (accumulated)
          EXISTING_BODY=$(gh release view dev-latest --repo "${{ github.repository }}" --json body -q '.body' 2>/dev/null || echo "")
          EXISTING_CHANGELOG=$(echo "$EXISTING_BODY" | sed -n '/^> \[!WARNING\]/,/^## Installation$/p' | tail -n +4 | sed '$d')

          {
            echo "> [!WARNING]"
            echo "> **Development Build** — May contain bugs or incomplete features"
            echo ""
            [ -n "$CHANGELOG" ] && printf "%s\n\n" "$CHANGELOG"
            [ -n "$EXISTING_CHANGELOG" ] && printf "%s\n" "$EXISTING_CHANGELOG"
            echo "## Installation"
            echo ""
            echo "<details>"
            echo "<summary><b>Quick Install (Recommended)</b></summary>"
            echo ""
            echo "1. Download \`HSEnhancer.dll\`"
            echo "2. Drag onto the Launcher executable"
            echo ""
            echo "</details>"
            echo ""
            echo "<details>"
            echo "<summary><b>Manual Install</b></summary>"
            echo ""
            echo "1. Download \`HSEnhancer.zip\`"
            echo "2. Extract and follow instructions in README"
            echo ""
            echo "</details>"
            echo ""
            echo "<!-- LAST_NOTIFIED_COMMIT: $CURRENT_COMMIT -->"
          } > release_body.md

          if gh release view dev-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit dev-latest --repo "${{ github.repository }}" --notes-file release_body.md
          else
            gh release create dev-latest --repo "${{ github.repository }}" --title "Dev Build" --notes-file release_body.md --prerelease
          fi

          [ "$MOD_CHANGED" == "true" ] && [ -f "release_files/HSEnhancer.dll" ] && \
            gh release upload dev-latest release_files/HSEnhancer.dll release_files/HSEnhancer.zip --repo "${{ github.repository }}" --clobber
          [ "$LAUNCHER_CHANGED" == "true" ] && [ -f "release_files/HSEnhancerLauncher.exe" ] && \
            gh release upload dev-latest release_files/HSEnhancerLauncher.exe --repo "${{ github.repository }}" --clobber
          true

      - name: Discord notification
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -z "$WEBHOOK_URL" ] && exit 0
          [ -z "$CHANGELOG" ] && exit 0

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/dev-latest"

          jq -n \
            --arg content "<@&1426630164053360640>"$'\n'"# New Dev Build"$'\n\n'"$CHANGELOG" \
            --arg url "$RELEASE_URL" \
            '{content: $content, components: [{type: 1, components: [{type: 2, style: 5, label: "Download", url: $url}]}], with_components: true}' | \
            curl -s -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK_URL"

      - name: Notify failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -z "$WEBHOOK_URL" ] && exit 0
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          jq -n --arg content "⚠️ **Dev Build Failed**"$'\n\n'"View logs: <$RUN_URL>" '{content: $content}' | \
            curl -s -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK_URL"

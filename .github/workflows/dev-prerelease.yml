name: Dev Pre-Release

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [main]
    paths: ['Mod/**', 'Launcher/**', 'Proxy/**', 'ext/**']

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build_mod: ${{ steps.analyze.outputs.build_mod }}
      build_launcher: ${{ steps.analyze.outputs.build_launcher }}
      has_changes: ${{ steps.analyze.outputs.has_changes }}
      changelog: ${{ steps.process.outputs.changelog }}
      current_commit: ${{ steps.analyze.outputs.current_commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Analyze changes
        id: analyze
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch all refs to ensure LAST_NOTIFIED_COMMIT is available
          git fetch origin --quiet

          # Get last notified commit for incremental changelog
          LAST_NOTIFIED=$(gh release view dev-latest --repo "${{ github.repository }}" --json body -q '.body' 2>/dev/null | \
            grep -oP '<!-- LAST_NOTIFIED_COMMIT: \K[a-f0-9]+(?= -->)' || echo "")

          # Determine base reference for changelog (what's new since last notification)
          echo "LAST_NOTIFIED: $LAST_NOTIFIED"
          if [ -n "$LAST_NOTIFIED" ] && git merge-base --is-ancestor "$LAST_NOTIFIED" HEAD 2>/dev/null; then
            BASE_REF="$LAST_NOTIFIED"
            echo "Using incremental changelog from $LAST_NOTIFIED"
          else
            BASE_REF="origin/main"
            echo "Using full changelog from origin/main (LAST_NOTIFIED not found or not ancestor)"
          fi
          echo "BASE_REF: $BASE_REF"

          # Detect changes using unified BASE_REF
          MOD_CHANGED=$(git diff --name-only "$BASE_REF"..HEAD -- 'Mod/**' 'Proxy/**' | grep -q . && echo true || echo false)
          LAUNCHER_CHANGED=$(git diff --name-only "$BASE_REF"..HEAD -- 'Launcher/**' | grep -q . && echo true || echo false)
          EXT_CHANGED=$(git diff --name-only "$BASE_REF"..HEAD -- 'ext/**' | grep -q . && echo true || echo false)

          # Pre-compute build triggers (ext/ triggers both)
          BUILD_MOD=$([[ "$MOD_CHANGED" == "true" || "$EXT_CHANGED" == "true" ]] && echo true || echo false)
          BUILD_LAUNCHER=$([[ "$LAUNCHER_CHANGED" == "true" || "$EXT_CHANGED" == "true" ]] && echo true || echo false)
          HAS_CHANGES=$([[ "$BUILD_MOD" == "true" || "$BUILD_LAUNCHER" == "true" ]] && echo true || echo false)

          echo "build_mod=$BUILD_MOD" >> $GITHUB_OUTPUT
          echo "build_launcher=$BUILD_LAUNCHER" >> $GITHUB_OUTPUT
          echo "has_changes=$HAS_CHANGES" >> $GITHUB_OUTPUT
          echo "current_commit=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT

          # Generate commits with hash for correlation
          git log "$BASE_REF"..HEAD --pretty=format:"- %h: %s" --no-merges \
            -- 'Mod/**' 'Launcher/**' 'Proxy/**' 'ext/**' ':!Mod/SDK/**' > commits.txt

          # Detect large files (>500 lines changed) for exclusion
          LARGE_FILES=$(git diff "$BASE_REF"..HEAD --numstat -- 'Mod/**' 'Launcher/**' 'Proxy/**' 'ext/**' | \
            awk '$1+$2 > 500 {print ":!" $3}')

          # Generate component-specific diffs (skip ext/ - rarely needs changelog entries)
          git log "$BASE_REF"..HEAD --no-merges --format=$'\\n=== %h ===' -p \
            -- 'Mod/**' ':!Mod/SDK/**' ':!*.vcxproj*' ':!*.rc' ':!*.filters' \
            $LARGE_FILES > mod.diff || true

          git log "$BASE_REF"..HEAD --no-merges --format=$'\\n=== %h ===' -p \
            -- 'Launcher/**' ':!*.vcxproj*' ':!*.rc' ':!*.filters' \
            $LARGE_FILES > launcher.diff || true

          git log "$BASE_REF"..HEAD --no-merges --format=$'\\n=== %h ===' -p \
            -- 'Proxy/**' ':!*.vcxproj*' ':!*.rc' ':!*.filters' \
            $LARGE_FILES > proxy.diff || true

          # Export commits as JSON string
          echo "commits_content=$(cat commits.txt 2>/dev/null | jq -Rs . || echo '""')" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: ai_changelog
        if: steps.analyze.outputs.has_changes == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            <role>
            Generate patch notes for Half Sword Enhancer, a mod for the medieval combat game Half Sword.
            The mod adds an in-game menu (INSERT key) with spawn controls, equipment management, and gameplay tweaks.
            Write for gamers, not developers.
            </role>

            <commits>
            ${{ fromJSON(steps.analyze.outputs.commits_content) }}
            </commits>

            <resources>
            - mod.diff: Mod project diffs with `=== HASH ===` markers
            - launcher.diff: Launcher project diffs with `=== HASH ===` markers
            - proxy.diff: Proxy project diffs with `=== HASH ===` markers
            - git show origin/main:PATH: Shows file content before these changes
            </resources>

            <process>
            STEP 1 - CLASSIFY each commit:
            By prefix:
            - feat: → Likely user-facing (verify with diff)
            - fix: → Check if user-visible bug or internal code
            - perf: → Include only if users would notice
            - refactor/style/chore/docs: → Usually internal, verify if behavior changes

            No prefix? Analyze the diff content to determine classification.

            STEP 2 - VERIFY by searching changes.diff:
            Search for `=== HASH ===` (replace with actual commit hash)
            Include if it affects: GUI elements, user settings, game features, error messages

            STEP 3 - VERIFY if NEW or IMPROVEMENT:
            For each potential "New Feature", spawn a Task with subagent_type: "Explore", model: "opus"

            Agent task prompt:
            "Verify if users could already perform this action in origin/main:

            USER ACTION: [describe what user CAN DO in the menu, not implementation]

            VERIFICATION:
            1. If the code path exists AND is reachable from UI → EXISTED
            2. Search with MULTIPLE alternative keywords (not just the PR's naming)
            3. Check if any implementation provides the same user capability

            Run: git show origin/main:path/file | grep -iE 'term1|term2|term3'

            DECISION:
            - Found equivalent user-facing capability → EXISTED
            - No way for users to do this action → NEW
            - Uncertain → EXISTED (safer default)

            Answer: EXISTED or NEW
            Evidence: [cite specific file:function or 'no matching code found']"

            Classification:
            - EXISTED → Improvements (even if implementation is completely rewritten)
            - NEW → New Features (ONLY if users couldn't do this before)

            When same feature has multiple commit types (feat + fix + perf):
            → Classify by most significant: if genuinely new, only New Feature
            → Fixes to a new feature are part of "Added X", not separate bullets

            STEP 4 - MERGE MULTI-COMMIT FEATURES:
            When multiple commits touch the same feature:
            - Combine into ONE bullet for that feature
            - Describe the net user-facing change
            - Don't list each commit separately

            If one commit contains multiple distinct changes (e.g., "feat: add X and fix Y"),
            create separate bullets for each change in appropriate sections.
            </process>

            <anti_patterns>
            These patterns are NEVER "New Features":
            - "refactored X" → Improvement or Other Changes
            - "improved X" → Improvement
            - "optimized X" → Improvement
            - "fixed X" → Bug Fix
            - "rewrote X" → Improvement (unless X didn't exist at all)
            - "added option to existing feature" → Improvement
            - "better UX for existing feature" → Improvement

            Only classify as NEW when:
            - The capability is fundamentally new (text search vs category browsing)
            - Users had NO way to achieve this before
            - The diff verifies no similar code existed in origin/main
            </anti_patterns>

            <categories>
            ## New Features
            Completely NEW functionality that didn't exist before.

            ## Bug Fixes
            Something was BROKEN, CRASHING, or behaving INCORRECTLY.

            ## Improvements
            Enhancements to EXISTING features: better UX, performance, new options.

            ## Other Changes
            Internal improvements that indirectly benefit users. Frame in terms of user benefit:
            - Bad: "Refactored keybind system"
            - Good: "Refactored keybind system for improved responsiveness"
            - Bad: "Optimized memory usage"
            - Good: "Optimized memory usage for better performance on lower-end systems"
            </categories>

            <subcategories>
            Use inline [Category] prefix for each bullet. Available categories:
            - [Spawner] - NPC/item spawning, clearing objects
            - [Graphics] - Visual settings, render scale, quality options
            - [Player] - Health, strength, abilities, body modifications
            - [Controls] - Keybinds, menu toggle, input handling
            - [Equipment] - Weapons, armor, loadout management
            - [World] - Time, weather, environment manipulation
            - [NPCs] - Enemy behavior, AI modifications
            - [Launcher] - Auto-updates, installation, startup (ONLY Launcher/ folder changes)
            - [Mod] - General mod functionality, initialization, DirectX hooks

            Determine category from file paths in the diff:
            - Mod/ folder → use appropriate category (Spawner, Graphics, Controls, etc.)
            - Launcher/ folder → [Launcher]
            - DirectX hooks, menu rendering, mod initialization → [Mod] or specific feature

            SUBCATEGORY VERIFICATION:
            After assigning [Category], verify it matches the content:
            - [Controls] must actually affect user input/keybinds
            - [Spawner] must affect spawning/clearing entities
            - If subcategory doesn't match content, use the correct one based on what the change DOES

            Format:
            ## New Features
            - [Spawner] Added option to spawn multiple NPCs at once
            - [Spawner] Added `Snap to Ground` for placed items
            - [Graphics] Added individual quality sliders
            </subcategories>

            <writing_rules>
            1. Translate technical terms to user impact:
               Bad: "Fixed SwapChain recreation failure in DirectXHook"
               Good: "Fixed rare crash when alt-tabbing in fullscreen"

            2. Describe what the user experiences, not implementation:
               Bad: "Added SetInputEnabled method to GameHook"
               Good: "Camera no longer moves when menu is open"

            3. Use backticks for feature/setting names: `Infinite Health`, `Spawn NPC`

            4. Combine related commits into one bullet (unless they span categories)

            5. Don't include:
               - Technical class names (GameHook, DirectXHook, ProcessEvent)
               - Internal file paths (Mod/src/Gui.cpp)
               - SDK/API terms (UObject, FString, TArray)

            6. When uncertain if user-facing: include it (err on side of inclusion)

            7. Each bullet describes ONE specific change. Don't merge multiple distinct features.
               Bad: "Dev builds now check for updates and migrate to stable releases"
               Good: "Dev builds now automatically update to newer dev versions"
               (If stable migration is separate, make it a separate bullet)

            8. Be specific. Avoid vague descriptions that could apply to multiple changes.
               Bad: "Improved update system"
               Good: "Dev builds now check for updates every 24 hours instead of on startup only"
            </writing_rules>

            <constraints>
            - Include all significant user-facing changes (no artificial limit)
            - Use judgment to prioritize important changes over trivial ones
            - Each bullet: 1 sentence, optionally 1-2 sub-bullets
            - Omit empty sections entirely
            - DEDUPLICATION: If the same change spans multiple categories:
              1. Merge into a single bullet describing both aspects
              2. Place in section matching the MOST IMPACTFUL user benefit
              3. Bug Fix if something was broken/crashing
              4. Improvement if enhancing working feature
            - Tone: Neutral and informative (not casual, not telegraphic)
            </constraints>

            <output_format>
            Return ONLY the changelog content (no explanations, no code blocks).
            Use markdown with ## headers for sections and [Category] inline prefixes.

            Example output:
            ## New Features
            - [Spawner] Added option to spawn multiple NPCs at once
            - [Spawner] Added `Clear Radius` setting for selective object removal
            - [Graphics] Added `Render Scale` slider for performance tuning

            ## Bug Fixes
            - [Controls] Fixed keybinds resetting after game restart
            - [Mod] Fixed potential crash during initialization on some graphics cards

            ## Improvements
            - [Player] Strength multiplier now goes up to 10x
            - [World] `Clear Objects` now more accurately detects items near players

            ## Other Changes
            - Refactored keybind processing for improved responsiveness
            - Optimized memory usage in spawn system architecture
            </output_format>
          claude_args: |
            --model claude-opus-4-5-20251101
            --allowedTools "Read,Glob,Grep,Task,Bash(cat:*),Bash(head:*),Bash(ls:*),Bash(git show:*)"
            --json-schema '{"type":"object","properties":{"changelog":{"type":"string"}},"required":["changelog"]}'
        continue-on-error: true

      - name: Process output
        id: process
        env:
          AI_OUTPUT: ${{ steps.ai_changelog.outputs.structured_output }}
        run: |
          if [ -n "$AI_OUTPUT" ] && echo "$AI_OUTPUT" | jq -e . >/dev/null 2>&1; then
            CHANGELOG=$(echo "$AI_OUTPUT" | jq -r '.changelog // empty')
          else
            CHANGELOG=""
          fi

          # Fallback: process conventional commits to user-friendly format
          if [ -z "$CHANGELOG" ] && [ -f commits.txt ]; then
            CHANGELOG=$(grep -E '^- [a-f0-9]+: (feat|fix|perf):' commits.txt | head -5 | \
              sed -E 's/^- [a-f0-9]+: feat(\([^)]*\))?: /- Added: /;
                      s/^- [a-f0-9]+: fix(\([^)]*\))?: /- Fixed: /;
                      s/^- [a-f0-9]+: perf(\([^)]*\))?: /- Improved: /')
            [ -z "$CHANGELOG" ] && CHANGELOG=$(head -5 commits.txt | sed 's/^- [a-f0-9]*: /- /')
          fi

          { echo "changelog<<EOF"; echo "$CHANGELOG"; echo "EOF"; } >> $GITHUB_OUTPUT

  build:
    needs: changelog
    if: needs.changelog.outputs.has_changes == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: microsoft/setup-msbuild@v2

      - name: Build Mod and Proxy
        if: needs.changelog.outputs.build_mod == 'true'
        shell: pwsh
        run: |
          MSBuild.exe "Mod/Mod.vcxproj" /p:Configuration="Release Dev" /p:Platform=x64 /p:PlatformToolset=v143 /p:SolutionDir="$PWD/"
          if ($LASTEXITCODE -ne 0) { throw "Mod build failed" }
          MSBuild.exe "Proxy/Proxy.vcxproj" /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:SolutionDir="$PWD/"
          if ($LASTEXITCODE -ne 0) { throw "Proxy build failed" }

      - name: Build Launcher
        if: needs.changelog.outputs.build_launcher == 'true'
        shell: pwsh
        run: |
          MSBuild.exe "Launcher/Launcher.vcxproj" /p:Configuration="Release Dev" /p:Platform=x64 /p:PlatformToolset=v143 /p:SolutionDir="$PWD/"
          if ($LASTEXITCODE -ne 0) { throw "Launcher build failed" }

      - name: Package
        shell: pwsh
        env:
          MOD_CHANGED: ${{ needs.changelog.outputs.build_mod }}
          LAUNCHER_CHANGED: ${{ needs.changelog.outputs.build_launcher }}
        run: |
          New-Item -ItemType Directory -Force -Path "release_files" | Out-Null

          if ($env:MOD_CHANGED -eq "true") {
            Copy-Item "bin/HSEnhancer.dll" "release_files/"
            New-Item -ItemType Directory -Force -Path "manual_install" | Out-Null
            Copy-Item "Manual_Install.txt" "manual_install/README.txt"
            Copy-Item "bin/dwmapi.dll" "manual_install/"
            Copy-Item "bin/HSEnhancer.dll" "manual_install/"
            Compress-Archive -Path "manual_install/*" -DestinationPath "release_files/HSEnhancer.zip" -Force
          }

          if ($env:LAUNCHER_CHANGED -eq "true") {
            Copy-Item "bin/HSEnhancerLauncherDev.exe" "release_files/HSEnhancerLauncher.exe"
          }

      - uses: actions/upload-artifact@v6
        if: needs.changelog.outputs.has_changes == 'true'
        with:
          name: release-files
          path: release_files/
          retention-days: 1

  release:
    needs: [changelog, build]
    if: needs.changelog.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MOD_CHANGED: ${{ needs.changelog.outputs.build_mod }}
      LAUNCHER_CHANGED: ${{ needs.changelog.outputs.build_launcher }}
      CHANGELOG: ${{ needs.changelog.outputs.changelog }}
      CURRENT_COMMIT: ${{ needs.changelog.outputs.current_commit }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-files
          path: release_files/

      - name: Publish release
        run: |
          # Extract existing changelog from release body (accumulated)
          EXISTING_BODY=$(gh release view dev-latest --repo "${{ github.repository }}" --json body -q '.body' 2>/dev/null || echo "")
          EXISTING_CHANGELOG=$(echo "$EXISTING_BODY" | sed -n '/^> \[!WARNING\]/,/^## Installation$/p' | tail -n +4 | sed '$d')

          {
            echo "> [!WARNING]"
            echo "> **Development Build** — May contain bugs or incomplete features"
            echo ""
            [ -n "$CHANGELOG" ] && printf "%s\n\n" "$CHANGELOG"
            [ -n "$EXISTING_CHANGELOG" ] && printf "%s\n" "$EXISTING_CHANGELOG"
            echo "## Installation"
            echo ""
            echo "<details>"
            echo "<summary><b>Quick Install (Recommended)</b></summary>"
            echo ""
            echo "1. Download \`HSEnhancer.dll\`"
            echo "2. Drag onto the Launcher executable"
            echo ""
            echo "</details>"
            echo ""
            echo "<details>"
            echo "<summary><b>Manual Install</b></summary>"
            echo ""
            echo "1. Download \`HSEnhancer.zip\`"
            echo "2. Extract and follow instructions in README"
            echo ""
            echo "</details>"
            echo ""
            echo "<!-- LAST_NOTIFIED_COMMIT: $CURRENT_COMMIT -->"
          } > release_body.md

          if gh release view dev-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit dev-latest --repo "${{ github.repository }}" --notes-file release_body.md
          else
            gh release create dev-latest --repo "${{ github.repository }}" --title "Dev Build" --notes-file release_body.md --prerelease
          fi

          [ "$MOD_CHANGED" == "true" ] && [ -f "release_files/HSEnhancer.dll" ] && \
            gh release upload dev-latest release_files/HSEnhancer.dll release_files/HSEnhancer.zip --repo "${{ github.repository }}" --clobber
          [ "$LAUNCHER_CHANGED" == "true" ] && [ -f "release_files/HSEnhancerLauncher.exe" ] && \
            gh release upload dev-latest release_files/HSEnhancerLauncher.exe --repo "${{ github.repository }}" --clobber
          true

      - name: Discord notification
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -z "$WEBHOOK_URL" ] && exit 0
          [ -z "$CHANGELOG" ] && exit 0

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/dev-latest"

          jq -n \
            --arg content "<@&1426630164053360640>"$'\n'"# New Dev Build"$'\n\n'"$CHANGELOG" \
            --arg url "$RELEASE_URL" \
            '{content: $content, components: [{type: 1, components: [{type: 2, style: 5, label: "Download", url: $url}]}], with_components: true}' | \
            curl -s -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK_URL"

      - name: Notify failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -z "$WEBHOOK_URL" ] && exit 0
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          jq -n --arg content "⚠️ **Dev Build Failed**"$'\n\n'"View logs: <$RUN_URL>" '{content: $content}' | \
            curl -s -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK_URL"

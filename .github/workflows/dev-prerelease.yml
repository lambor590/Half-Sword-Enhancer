name: Dev Pre-Release

on:
  push:
    branches: [dev]
    paths: ['Mod/**', 'Launcher/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.vcxproj') }}

      - name: Build
        shell: pwsh
        run: |
          MSBuild.exe "Half Sword Enhancer.sln" /p:Configuration="Release Dev" /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }
          "### Build Complete ✅" >> $env:GITHUB_STEP_SUMMARY

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release_files", "manual_install" | Out-Null
          Copy-Item "bin/HSEnhancerLauncherDev.exe" "release_files/HSEnhancerLauncher.exe"
          Copy-Item "bin/HSEnhancer.dll" "release_files/HSEnhancer.dll"
          Copy-Item "Manual_Install.txt" "manual_install/README.txt"
          Copy-Item "bin/dwmapi.dll" "manual_install/"
          Copy-Item "bin/HSEnhancer.dll" "manual_install/HSEnhancer.dll"
          Compress-Archive -Path "manual_install/*" -DestinationPath "release_files/HSEnhancer.zip" -Force

      - uses: actions/upload-artifact@v6
        with:
          name: release-files
          path: release_files/
          retention-days: 1

  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full: ${{ steps.process.outputs.full }}
      incremental: ${{ steps.process.outputs.incremental }}
      has_changes: ${{ steps.analyze.outputs.has_changes }}
      components: ${{ steps.analyze.outputs.components }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Analyze changes
        id: analyze
        run: |
          git fetch origin main:main || { echo "::error::Failed to fetch main branch"; exit 1; }

          MOD=$(git diff --name-only main..HEAD -- 'Mod/**' | wc -l)
          LAUNCHER=$(git diff --name-only main..HEAD -- 'Launcher/**' | wc -l)
          [ "$MOD" -gt 0 ] && [ "$LAUNCHER" -gt 0 ] && COMP="Mod + Launcher" || \
          { [ "$MOD" -gt 0 ] && COMP="Mod" || COMP="Launcher"; }
          echo "components=$COMP" >> $GITHUB_OUTPUT

          git log main..HEAD --pretty=format:"- %s" --no-merges > commits.txt
          git diff main..HEAD -- '*.cpp' '*.h' '*.hpp' ':!Mod/SDK/**' | head -c 100000 > changes.diff

          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git log "$BEFORE..${{ github.event.after }}" --pretty=format:"- %s" --no-merges > commits_incremental.txt
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            git log -1 --pretty=format:"- %s" --no-merges > commits_incremental.txt
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        id: ai_changelog
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Generate changelogs for Half Sword Enhancer (C++ mod for Unreal Engine 5).

            Read: commits.txt, changes.diff, commits_incremental.txt

            Output valid JSON with two fields:

            1. "full": Complete changelog for GitHub (all changes since main)
               - Group by: Features, Improvements, Bug Fixes, Technical
               - Skip empty categories, be concise

            2. "incremental": Brief summary for Discord (this push only)
               - Group similar commits together
               - Max 3-5 bullet points, user-friendly

            Format: {"full": "### Features\n- ...", "incremental": "- ..."}
          claude_args: --model claude-sonnet-4-5-20250929
        continue-on-error: true

      - name: Process output
        id: process
        run: |
          AI_OUTPUT='${{ steps.ai_changelog.outputs.result }}'

          if echo "$AI_OUTPUT" | jq -e . >/dev/null 2>&1; then
            FULL=$(echo "$AI_OUTPUT" | jq -r '.full // empty')
            INCREMENTAL=$(echo "$AI_OUTPUT" | jq -r '.incremental // empty')
          else
            FULL=""
            INCREMENTAL=""
          fi

          [ -z "$FULL" ] && FULL=$(head -20 commits.txt)
          [ -z "$FULL" ] && FULL="No changes since main branch."
          [ -z "$INCREMENTAL" ] && INCREMENTAL=$(cat commits_incremental.txt 2>/dev/null || echo "No new commits.")

          { echo "full<<EOF"; echo "$FULL"; echo "EOF"; } >> $GITHUB_OUTPUT
          { echo "incremental<<EOF"; echo "$INCREMENTAL"; echo "EOF"; } >> $GITHUB_OUTPUT

  release:
    needs: [build, changelog]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-files
          path: release_files/

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPONENTS: ${{ needs.changelog.outputs.components }}
          CHANGELOG: ${{ needs.changelog.outputs.full }}
        run: |
          # Format components as inline code badges
          COMP_BADGES=$(echo "$COMPONENTS" | sed 's/Mod/`Mod`/g; s/Launcher/`Launcher`/g; s/ + / /g')

          {
            echo "> [!WARNING]"
            echo "> **Development Build** - This build may contain bugs or incomplete features."
            echo ""
            echo "## Components Updated"
            echo ""
            echo "$COMP_BADGES"
            echo ""
            echo "## What's Changed"
            echo ""
            echo "$CHANGELOG"
            echo ""
            echo "## Installation"
            echo ""
            echo "| Method | Instructions |"
            echo "|--------|--------------|"
            echo "| **Launcher** | Download \`HSEnhancer.dll\` and drag it onto the Launcher executable |"
            echo "| **Manual** | Replace the mod DLL in your game folder (see README in ZIP) |"
            echo ""
            echo "> **Note:** The dev DLL works with both the dev and release versions of the Launcher."
            echo ""
            echo "---"
            echo ""
            echo "*Automated build from dev branch*"
          } > release_body.md

          if gh release view dev-latest >/dev/null 2>&1; then
            gh release edit dev-latest --notes-file release_body.md
            gh release upload dev-latest release_files/* --clobber
          else
            gh release create dev-latest \
              --title "Dev Build" \
              --notes-file release_body.md \
              --prerelease \
              release_files/*
          fi

      - name: Discord notification
        if: needs.changelog.outputs.has_changes == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          COMPONENTS: ${{ needs.changelog.outputs.components }}
          CHANGELOG: ${{ needs.changelog.outputs.incremental }}
        run: |
          [ -z "$WEBHOOK_URL" ] && exit 0

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/dev-latest"
          [ ${#CHANGELOG} -gt 900 ] && CHANGELOG="${CHANGELOG:0:897}..."

          jq -n \
            --arg ping "<@&1426630164053360640>" \
            --arg components "$COMPONENTS" \
            --arg changelog "$CHANGELOG" \
            --arg url "$RELEASE_URL" \
            '{
              content: $ping,
              embeds: [{
                title: "New Dev Build Available",
                url: $url,
                color: 5814783,
                fields: [
                  {name: "Components", value: $components, inline: true},
                  {name: "Changes", value: $changelog, inline: false}
                ],
                footer: {text: "Development build - may be unstable"}
              }]
            }' | curl -s -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK_URL"

  notify-failure:
    needs: [build, changelog, release]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Discord failure notification
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -z "$WEBHOOK_URL" ] && exit 0
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          jq -n \
            --arg url "$RUN_URL" \
            '{
              embeds: [{
                title: "Dev Build Failed",
                url: $url,
                color: 15158332,
                description: "The pipeline encountered an error. Click the title to view logs.",
                footer: {text: "Build failure"}
              }]
            }' | curl -s -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK_URL"

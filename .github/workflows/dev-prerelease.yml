name: Dev Pre-Release

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [main]
    paths: ['Mod/**', 'Launcher/**', 'Proxy/**', 'ext/**']

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mod_changed: ${{ steps.detect.outputs.mod_changed }}
      launcher_changed: ${{ steps.detect.outputs.launcher_changed }}
      proxy_changed: ${{ steps.detect.outputs.proxy_changed }}
      mod_changelog: ${{ steps.process.outputs.mod_changelog }}
      launcher_changelog: ${{ steps.process.outputs.launcher_changelog }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changes
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Function to get latest commit timestamp for a path
          get_latest_commit_ts() {
            git log -1 --format=%ct -- "$1" 2>/dev/null || echo "0"
          }

          # Function to get asset timestamp from dev-latest release
          get_asset_ts() {
            local asset_name="$1"
            local ts=$(gh release view dev-latest --repo "${{ github.repository }}" --json assets \
              -q ".assets[] | select(.name == \"$asset_name\") | .updatedAt" 2>/dev/null)
            [ -n "$ts" ] && date -d "$ts" +%s 2>/dev/null || echo "0"
          }

          # Get latest commit timestamps per component
          MOD_COMMIT_TS=$(get_latest_commit_ts "Mod/")
          LAUNCHER_COMMIT_TS=$(get_latest_commit_ts "Launcher/")
          PROXY_COMMIT_TS=$(get_latest_commit_ts "Proxy/")
          SHARED_COMMIT_TS=$(get_latest_commit_ts "ext/")

          # Get asset timestamps from dev-latest release
          MOD_ASSET_TS=$(get_asset_ts "HSEnhancer.dll")
          LAUNCHER_ASSET_TS=$(get_asset_ts "HSEnhancerLauncher.exe")
          PROXY_ASSET_TS=$(get_asset_ts "HSEnhancer.zip")

          # Determine what needs rebuild (commit newer than asset)
          MOD_STALE=$([[ $MOD_COMMIT_TS -gt $MOD_ASSET_TS ]] && echo true || echo false)
          LAUNCHER_STALE=$([[ $LAUNCHER_COMMIT_TS -gt $LAUNCHER_ASSET_TS ]] && echo true || echo false)
          PROXY_STALE=$([[ $PROXY_COMMIT_TS -gt $PROXY_ASSET_TS ]] && echo true || echo false)

          # Shared files (ext/) affect Mod and Launcher
          if [[ $SHARED_COMMIT_TS -gt $MOD_ASSET_TS ]]; then
            MOD_STALE=true
          fi
          if [[ $SHARED_COMMIT_TS -gt $LAUNCHER_ASSET_TS ]]; then
            LAUNCHER_STALE=true
          fi

          # Coupling rule: Mod and Proxy always together
          if [[ "$MOD_STALE" == "true" || "$PROXY_STALE" == "true" ]]; then
            MOD_STALE=true
            PROXY_STALE=true
          fi

          # Fallback to git diff for PRs (when valid before exists)
          BEFORE="${{ github.event.before }}"
          if [[ -n "$BEFORE" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            git fetch origin main:main 2>/dev/null || true
            MOD_DIFF=$(git diff --name-only "$BEFORE"..${{ github.sha }} -- 'Mod/**' 2>/dev/null | wc -l)
            LAUNCHER_DIFF=$(git diff --name-only "$BEFORE"..${{ github.sha }} -- 'Launcher/**' 2>/dev/null | wc -l)
            PROXY_DIFF=$(git diff --name-only "$BEFORE"..${{ github.sha }} -- 'Proxy/**' 2>/dev/null | wc -l)
            SHARED_DIFF=$(git diff --name-only "$BEFORE"..${{ github.sha }} -- 'ext/**' 2>/dev/null | wc -l)

            [[ $MOD_DIFF -gt 0 || $SHARED_DIFF -gt 0 ]] && MOD_STALE=true
            [[ $LAUNCHER_DIFF -gt 0 || $SHARED_DIFF -gt 0 ]] && LAUNCHER_STALE=true
            [[ $PROXY_DIFF -gt 0 ]] && PROXY_STALE=true

            # Re-apply coupling rule
            if [[ "$MOD_STALE" == "true" || "$PROXY_STALE" == "true" ]]; then
              MOD_STALE=true
              PROXY_STALE=true
            fi
          fi

          echo "mod_changed=$MOD_STALE" >> $GITHUB_OUTPUT
          echo "launcher_changed=$LAUNCHER_STALE" >> $GITHUB_OUTPUT
          echo "proxy_changed=$PROXY_STALE" >> $GITHUB_OUTPUT

          # Summary table
          echo "### Change Detection" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Commit TS | Asset TS | Stale |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-----------|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Mod | $(date -d @$MOD_COMMIT_TS -Iseconds 2>/dev/null || echo N/A) | $(date -d @$MOD_ASSET_TS -Iseconds 2>/dev/null || echo N/A) | $MOD_STALE |" >> $GITHUB_STEP_SUMMARY
          echo "| Launcher | $(date -d @$LAUNCHER_COMMIT_TS -Iseconds 2>/dev/null || echo N/A) | $(date -d @$LAUNCHER_ASSET_TS -Iseconds 2>/dev/null || echo N/A) | $LAUNCHER_STALE |" >> $GITHUB_STEP_SUMMARY
          echo "| Proxy | $(date -d @$PROXY_COMMIT_TS -Iseconds 2>/dev/null || echo N/A) | $(date -d @$PROXY_ASSET_TS -Iseconds 2>/dev/null || echo N/A) | $PROXY_STALE |" >> $GITHUB_STEP_SUMMARY
          echo "| Shared (ext/) | $(date -d @$SHARED_COMMIT_TS -Iseconds 2>/dev/null || echo N/A) | - | - |" >> $GITHUB_STEP_SUMMARY

      - name: Analyze commits
        id: analyze
        run: |
          git log main..HEAD --pretty=format:"- %s" --no-merges > commits.txt
          git diff main..HEAD -- '*.cpp' '*.h' '*.hpp' ':!Mod/SDK/**' | head -c 100000 > changes.diff

      - name: Generate changelog
        id: ai_changelog
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            Generate changelogs for Half Sword Enhancer (C++ mod for Unreal Engine 5).

            **Input Files:**
            1. commits.txt - Recent commit messages
            2. changes.diff - Code diff (max 100KB)

            **Output Requirements:**
            Return valid JSON with this exact structure:
            {
              "mod": "- Feature X\n- Bug fix Y",
              "launcher": "- Update improvement"
            }

            **Rules:**
            1. Only include components with actual changes
            2. Each entry starts with "- "
            3. Be concise but complete - include all relevant changes
            4. Focus on user-facing changes
            5. Empty string "" for no changes
          claude_args: |
            --model claude-sonnet-4-5-20250929
            --allowedTools "Read,Bash(cat:*),Bash(head:*)"
            --json-schema '{"type":"object","properties":{"mod":{"type":"string","description":"Changelog for Mod component"},"launcher":{"type":"string","description":"Changelog for Launcher component"}},"required":["mod","launcher"]}'
        continue-on-error: true

      - name: Process output
        id: process
        env:
          AI_OUTPUT: ${{ steps.ai_changelog.outputs.structured_output }}
        run: |
          if [ -n "$AI_OUTPUT" ] && echo "$AI_OUTPUT" | jq -e . >/dev/null 2>&1; then
            MOD_CL=$(echo "$AI_OUTPUT" | jq -r '.mod // empty')
            LAUNCHER_CL=$(echo "$AI_OUTPUT" | jq -r '.launcher // empty')
          else
            MOD_CL=""
            LAUNCHER_CL=""
          fi

          # Fallback to commit messages if AI failed
          [ -z "$MOD_CL" ] && [ "${{ steps.detect.outputs.mod_changed }}" == "true" ] && [ -f commits.txt ] && \
            MOD_CL=$(head -5 commits.txt)
          [ -z "$LAUNCHER_CL" ] && [ "${{ steps.detect.outputs.launcher_changed }}" == "true" ] && [ -f commits.txt ] && \
            LAUNCHER_CL=$(head -5 commits.txt)

          { echo "mod_changelog<<EOF"; echo "$MOD_CL"; echo "EOF"; } >> $GITHUB_OUTPUT
          { echo "launcher_changelog<<EOF"; echo "$LAUNCHER_CL"; echo "EOF"; } >> $GITHUB_OUTPUT

  build:
    needs: changelog
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.vcxproj') }}

      - name: Build Mod
        if: needs.changelog.outputs.mod_changed == 'true' || needs.changelog.outputs.proxy_changed == 'true'
        shell: pwsh
        run: |
          MSBuild.exe "Mod/Mod.vcxproj" /p:Configuration="Release Dev" /p:Platform=x64 /p:PlatformToolset=v143 /p:SolutionDir="$PWD/"
          if ($LASTEXITCODE -ne 0) { throw "Mod build failed" }
          "### Mod Build ✅" >> $env:GITHUB_STEP_SUMMARY

      - name: Build Launcher
        if: needs.changelog.outputs.launcher_changed == 'true'
        shell: pwsh
        run: |
          MSBuild.exe "Launcher/Launcher.vcxproj" /p:Configuration="Release Dev" /p:Platform=x64 /p:PlatformToolset=v143 /p:SolutionDir="$PWD/"
          if ($LASTEXITCODE -ne 0) { throw "Launcher build failed" }
          "### Launcher Build ✅" >> $env:GITHUB_STEP_SUMMARY

      - name: Build Proxy
        if: needs.changelog.outputs.proxy_changed == 'true'
        shell: pwsh
        run: |
          MSBuild.exe "Proxy/Proxy.vcxproj" /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:SolutionDir="$PWD/"
          if ($LASTEXITCODE -ne 0) { throw "Proxy build failed" }
          "### Proxy Build ✅" >> $env:GITHUB_STEP_SUMMARY

      - name: Package
        shell: pwsh
        env:
          MOD_CHANGED: ${{ needs.changelog.outputs.mod_changed }}
          LAUNCHER_CHANGED: ${{ needs.changelog.outputs.launcher_changed }}
          PROXY_CHANGED: ${{ needs.changelog.outputs.proxy_changed }}
        run: |
          New-Item -ItemType Directory -Force -Path "release_files" | Out-Null

          if ($env:MOD_CHANGED -eq "true" -or $env:PROXY_CHANGED -eq "true") {
            Copy-Item "bin/HSEnhancer.dll" "release_files/"
            New-Item -ItemType Directory -Force -Path "manual_install" | Out-Null
            Copy-Item "Manual_Install.txt" "manual_install/README.txt"
            Copy-Item "bin/dwmapi.dll" "manual_install/"
            Copy-Item "bin/HSEnhancer.dll" "manual_install/"
            Compress-Archive -Path "manual_install/*" -DestinationPath "release_files/HSEnhancer.zip" -Force
          }

          if ($env:LAUNCHER_CHANGED -eq "true") {
            Copy-Item "bin/HSEnhancerLauncherDev.exe" "release_files/HSEnhancerLauncher.exe"
          }

      - uses: actions/upload-artifact@v6
        if: needs.changelog.outputs.mod_changed == 'true' || needs.changelog.outputs.launcher_changed == 'true' || needs.changelog.outputs.proxy_changed == 'true'
        with:
          name: release-files
          path: release_files/
          retention-days: 1

  release:
    needs: [changelog, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MOD_CHANGED: ${{ needs.changelog.outputs.mod_changed }}
      LAUNCHER_CHANGED: ${{ needs.changelog.outputs.launcher_changed }}
      MOD_CHANGELOG: ${{ needs.changelog.outputs.mod_changelog }}
      LAUNCHER_CHANGELOG: ${{ needs.changelog.outputs.launcher_changelog }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-files
          path: release_files/

      - name: Publish release
        id: publish
        run: |
          PREV_NOTES=$(gh release view dev-latest --repo "${{ github.repository }}" --json body -q '.body' 2>/dev/null || echo "")
          {
            echo "prev_notes<<EOF"
            echo "$PREV_NOTES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

          {
            echo "> [!WARNING]"
            echo "> **Development Build** — May contain bugs or incomplete features"
            echo ""
            [ "$MOD_CHANGED" == "true" ] && printf "## Mod\n\n%s\n\n" "$MOD_CHANGELOG"
            [ "$LAUNCHER_CHANGED" == "true" ] && printf "## Launcher\n\n%s\n\n" "$LAUNCHER_CHANGELOG"
            echo "## Installation"
            echo ""
            echo "<details>"
            echo "<summary><b>Quick Install (Recommended)</b></summary>"
            echo ""
            echo "1. Download \`HSEnhancer.dll\`"
            echo "2. Drag onto the Launcher executable"
            echo ""
            echo "</details>"
            echo ""
            echo "<details>"
            echo "<summary><b>Manual Install</b></summary>"
            echo ""
            echo "1. Download \`HSEnhancer.zip\`"
            echo "2. Extract and follow instructions in README"
            echo ""
            echo "</details>"
          } > release_body.md

          if gh release view dev-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit dev-latest --repo "${{ github.repository }}" --notes-file release_body.md
          else
            gh release create dev-latest --repo "${{ github.repository }}" --title "Dev Build" --notes-file release_body.md --prerelease
          fi

          [ "$MOD_CHANGED" == "true" ] && [ -f "release_files/HSEnhancer.dll" ] && \
            gh release upload dev-latest release_files/HSEnhancer.dll release_files/HSEnhancer.zip --repo "${{ github.repository }}" --clobber
          [ "$LAUNCHER_CHANGED" == "true" ] && [ -f "release_files/HSEnhancerLauncher.exe" ] && \
            gh release upload dev-latest release_files/HSEnhancerLauncher.exe --repo "${{ github.repository }}" --clobber
          true

      - name: Discord notification
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          PREV_NOTES: ${{ steps.publish.outputs.prev_notes }}
        run: |
          [ -z "$WEBHOOK_URL" ] && exit 0

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/dev-latest"

          filter_new() {
            echo "$1" | while IFS= read -r line; do
              [ -n "$line" ] && ! echo "$PREV_NOTES" | grep -qF "$line" && echo "$line"
            done
          }

          MSG="## New Dev Build Available"$'\n\n'
          HAS_NEW=false

          if [ "$MOD_CHANGED" == "true" ] && [ -n "$MOD_CHANGELOG" ]; then
            NEW_MOD=$(filter_new "$MOD_CHANGELOG")
            [ -n "$NEW_MOD" ] && MSG+="### Mod"$'\n'"$NEW_MOD"$'\n\n' && HAS_NEW=true
          fi

          if [ "$LAUNCHER_CHANGED" == "true" ] && [ -n "$LAUNCHER_CHANGELOG" ]; then
            NEW_LAUNCHER=$(filter_new "$LAUNCHER_CHANGELOG")
            [ -n "$NEW_LAUNCHER" ] && MSG+="### Launcher"$'\n'"$NEW_LAUNCHER"$'\n\n' && HAS_NEW=true
          fi

          [ "$HAS_NEW" = true ] && jq -n \
            --arg content "<@&1426630164053360640>"$'\n\n'"$MSG" \
            --arg url "$RELEASE_URL" \
            '{content: $content, components: [{type: 1, components: [{type: 2, style: 5, label: "Download", url: $url}]}]}' | \
            curl -s -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK_URL?with_components=true"

  notify-failure:
    needs: [changelog, build, release]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Discord failure notification
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -z "$WEBHOOK_URL" ] && exit 0
          RUN_URL="<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>"

          jq -n --arg content "⚠️ **Dev Build Failed**"$'\n\n'"View logs: $RUN_URL" '{content: $content}' | \
            curl -s -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK_URL"

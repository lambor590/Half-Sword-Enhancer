name: Dev Pre-Release

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dev-build:
    runs-on: self-hosted

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Release
      shell: pwsh
      run: |
        MSBuild.exe "Half Sword Enhancer.sln" /p:Configuration=Release /p:Platform=x64
        if ($LASTEXITCODE -ne 0) { throw "Build failed" }

        New-Item -ItemType Directory -Force -Path "release_files" | Out-Null
        Copy-Item "bin/HS Enhancer Launcher.exe" "release_files/HS_Enhancer_Launcher.exe"
        Copy-Item "bin/HS Enhancer.dll" "release_files/HS-Enhancer.dll"

    - name: Create manual installation ZIP
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "manual_install" | Out-Null

        Copy-Item "Manual_Install.txt" "manual_install/README.txt"

        Copy-Item "bin/dwmapi.dll" "manual_install/dwmapi.dll"
        Copy-Item "release_files/HS-Enhancer.dll" "manual_install/HS-Enhancer.dll"

        Compress-Archive -Path "manual_install/*" -DestinationPath "release_files/HS_Enhancer.zip" -Force

    - name: Get previous beta commit
      id: previous_beta
      shell: pwsh
      run: |
        $releaseExists = gh release view dev-latest --json targetCommitish 2>&1
        if ($LASTEXITCODE -eq 0) {
          $releaseInfo = gh release view dev-latest --json targetCommitish | ConvertFrom-Json
          $previousSha = $releaseInfo.targetCommitish
          Write-Host "Previous beta was at commit: $previousSha"
          Write-Output "sha=$previousSha" >> $env:GITHUB_OUTPUT
          Write-Output "exists=true" >> $env:GITHUB_OUTPUT
        } else {
          Write-Host "No previous beta found, using main branch as reference"
          $mainSha = git rev-parse main
          Write-Output "sha=$mainSha" >> $env:GITHUB_OUTPUT
          Write-Output "exists=false" >> $env:GITHUB_OUTPUT
        }
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate changelog from commits
      id: changelog
      shell: pwsh
      run: |
        git fetch origin main:main

        $previousSha = "${{ steps.previous_beta.outputs.sha }}"

        $commitsFromMain = @(git log main..dev --pretty=format:"- %s" --no-merges)
        if ($commitsFromMain.Count -eq 0) {
          $fullChangelog = "No new changes since main branch."
        } else {
          $commitList = $commitsFromMain -join "`n"
          $fullChangelog = "## Changes in dev branch:`n`n$commitList"
        }

        $commitsFromLastBeta = @(git log "$previousSha..HEAD" --pretty=format:"- %s" --no-merges)
        if ($commitsFromLastBeta.Count -eq 0) {
          $incrementalChangelog = "No new commits since last beta build."
          $hasNewCommits = "false"
        } else {
          $incrementalList = $commitsFromLastBeta -join "`n"
          $incrementalChangelog = $incrementalList
          $hasNewCommits = "true"
        }

        Write-Output "full_changelog<<EOF" >> $env:GITHUB_OUTPUT
        Write-Output $fullChangelog >> $env:GITHUB_OUTPUT
        Write-Output "EOF" >> $env:GITHUB_OUTPUT

        Write-Output "incremental_changelog<<EOF" >> $env:GITHUB_OUTPUT
        Write-Output $incrementalChangelog >> $env:GITHUB_OUTPUT
        Write-Output "EOF" >> $env:GITHUB_OUTPUT

        Write-Output "has_new_commits=$hasNewCommits" >> $env:GITHUB_OUTPUT

    - name: Update or create beta pre-release
      shell: pwsh
      run: |
        $betaExists = "${{ steps.previous_beta.outputs.exists }}"

        $body = @"
        ⚠️ **This is a beta build for testing purposes.**

        This build contains the latest changes from the development branch and may be unstable.

        ${{ steps.changelog.outputs.full_changelog }}
        "@

        $bodyFile = "release_body.txt"
        $body | Out-File -FilePath $bodyFile -Encoding utf8

        if ($betaExists -eq "true") {
          Write-Host "Updating existing beta release..."

          gh release edit dev-latest --notes-file $bodyFile

          Write-Host "Uploading updated files..."
          gh release upload dev-latest release_files/HS_Enhancer_Launcher.exe --clobber
          gh release upload dev-latest release_files/HS-Enhancer.dll --clobber
          gh release upload dev-latest release_files/HS_Enhancer.zip --clobber
        } else {
          Write-Host "Creating new beta release..."

          gh release create dev-latest `
            --title "Beta Build" `
            --notes-file $bodyFile `
            --prerelease `
            release_files/HS_Enhancer_Launcher.exe `
            release_files/HS-Enhancer.dll `
            release_files/HS_Enhancer.zip
        }

        Remove-Item $bodyFile
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Send Discord notification
      if: steps.changelog.outputs.has_new_commits == 'true'
      shell: pwsh
      run: |
        $webhookUrl = "${{ secrets.DISCORD_WEBHOOK }}"

        if ([string]::IsNullOrWhiteSpace($webhookUrl)) {
          Write-Host "No Discord webhook configured, skipping notification"
          exit 0
        }

        $repoName = "${{ github.repository }}"
        $releaseUrl = "https://github.com/$repoName/releases/tag/dev-latest"

        $commitList = "${{ steps.changelog.outputs.incremental_changelog }}"

        $webhookData = @{
          content = "**A new beta build has been released!**"
          embeds = @(
            @{
              title = "HSE Beta Build"
              description = "Latest development changes"
              color = 16766720
              fields = @(
                @{
                  name = "Changelog"
                  value = $commitList
                  inline = $false
                }
              )
            }
          )
          components = @(
            @{
              type = 1
              components = @(
                @{
                  type = 2
                  style = 5
                  label = "Download Beta"
                  url = $releaseUrl
                }
              )
            }
          )
        }

        $jsonPayload = $webhookData | ConvertTo-Json -Depth 10 -Compress

        try {
          $response = Invoke-RestMethod -Uri $webhookUrl -Method Post -Body $jsonPayload -ContentType "application/json; charset=utf-8"
          Write-Host "Discord notification sent successfully"
        } catch {
          Write-Warning "Failed to send Discord notification: $_"
        }

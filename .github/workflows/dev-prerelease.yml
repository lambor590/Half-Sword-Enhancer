name: Dev Pre-Release

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [main]
    paths: ['Mod/**', 'Launcher/**', 'Proxy/**', 'ext/**']

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build_mod: ${{ steps.analyze.outputs.build_mod }}
      build_launcher: ${{ steps.analyze.outputs.build_launcher }}
      has_changes: ${{ steps.analyze.outputs.has_changes }}
      current_commit: ${{ steps.analyze.outputs.current_commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Analyze changes
        id: analyze
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin --quiet

          # Get release body for context
          RELEASE_BODY=$(gh release view dev-latest --repo "${{ github.repository }}" --json body -q '.body' 2>/dev/null || echo "")

          # Get last notified commit (for incremental comparison)
          LAST_NOTIFIED=$(echo "$RELEASE_BODY" | grep -oP '<!-- LAST_NOTIFIED_COMMIT: \K[a-f0-9]+(?= -->)' || echo "")

          # Extract existing changelog (for GitHub accumulation)
          EXISTING_CHANGELOG=$(echo "$RELEASE_BODY" | sed -n '/^> \[!WARNING\]/,/^## Installation$/p' | tail -n +4 | sed '$d' || echo "")

          # Determine base reference
          if [ -n "$LAST_NOTIFIED" ] && git merge-base --is-ancestor "$LAST_NOTIFIED" HEAD 2>/dev/null; then
            BASE_REF="$LAST_NOTIFIED"
          else
            BASE_REF="origin/main"
          fi

          # Detect changes
          BUILD_MOD=$(git diff --name-only "$BASE_REF"..HEAD -- 'Mod/**' 'Proxy/**' 'ext/**' | grep -q . && echo true || echo false)
          BUILD_LAUNCHER=$(git diff --name-only "$BASE_REF"..HEAD -- 'Launcher/**' 'ext/**' | grep -q . && echo true || echo false)
          HAS_CHANGES=$([[ "$BUILD_MOD" == "true" || "$BUILD_LAUNCHER" == "true" ]] && echo true || echo false)

          echo "build_mod=$BUILD_MOD" >> $GITHUB_OUTPUT
          echo "build_launcher=$BUILD_LAUNCHER" >> $GITHUB_OUTPUT
          echo "has_changes=$HAS_CHANGES" >> $GITHUB_OUTPUT
          echo "current_commit=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT

          # Generate commits list
          git log "$BASE_REF"..HEAD --pretty=format:"- %h: %s" --no-merges \
            -- 'Mod/**' 'Launcher/**' 'Proxy/**' 'ext/**' ':!Mod/SDK/**' > commits.txt

          # Generate component-specific diffs
          git log "$BASE_REF"..HEAD --no-merges --format=$'\n=== %h ===' -p \
            -- 'Mod/**' ':!Mod/SDK/**' ':!*.vcxproj*' ':!*.rc' ':!*.filters' > mod.diff || true

          git log "$BASE_REF"..HEAD --no-merges --format=$'\n=== %h ===' -p \
            -- 'Launcher/**' ':!*.vcxproj*' ':!*.rc' ':!*.filters' > launcher.diff || true

          git log "$BASE_REF"..HEAD --no-merges --format=$'\n=== %h ===' -p \
            -- 'Proxy/**' ':!*.vcxproj*' ':!*.rc' ':!*.filters' > proxy.diff || true

          echo "commits_content=$(cat commits.txt 2>/dev/null | jq -Rs . || echo '""')" >> $GITHUB_OUTPUT
          echo "$EXISTING_CHANGELOG" > existing_changelog.txt

      - name: Generate changelog
        id: ai_changelog
        if: steps.analyze.outputs.has_changes == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            <role>
            Generate patch notes for Half Sword Enhancer mod. Write for gamers, not developers.
            Be concise - Discord has 2000 char limit.
            </role>

            <commits>
            ${{ fromJSON(steps.analyze.outputs.commits_content) }}
            </commits>

            <resources>
            Read these files for context:
            - mod.diff: Changes in Mod/ project
            - launcher.diff: Changes in Launcher/ project
            - proxy.diff: Changes in Proxy/ project
            </resources>

            <classification>
            - New feature: New functionality added (new files, new functions, new options)
            - Improvement: Enhanced existing functionality
            - Bug fix: Fixed something that was broken
            - Other: Internal changes, refactors with no user impact
            </classification>

            <categories>
            Spawner, Graphics, Player, Controls, Equipment, World, NPCs, Launcher, Mod, Internal
            </categories>

            <rules>
            1. Describe user impact, not implementation details
            2. Use backticks for feature names: `Infinite Health`
            3. One sentence per entry
            4. Merge multi-commit features into single entries
            </rules>

            <output_schema>
            {
              "new_features": [{"category": "...", "description": "..."}],
              "improvements": [{"category": "...", "description": "..."}],
              "bug_fixes": [{"category": "...", "description": "..."}],
              "other_changes": [{"category": "...", "description": "..."}]
            }
            </output_schema>
          claude_args: |
            --model claude-opus-4-5-20251101
            --allowedTools "Read,Glob,Grep,Task,Bash(cat:*),Bash(head:*),Bash(ls:*)"
            --json-schema '{"type":"object","properties":{"new_features":{"type":"array","items":{"type":"object","properties":{"category":{"type":"string"},"description":{"type":"string"}},"required":["category","description"]}},"improvements":{"type":"array","items":{"type":"object","properties":{"category":{"type":"string"},"description":{"type":"string"}},"required":["category","description"]}},"bug_fixes":{"type":"array","items":{"type":"object","properties":{"category":{"type":"string"},"description":{"type":"string"}},"required":["category","description"]}},"other_changes":{"type":"array","items":{"type":"object","properties":{"category":{"type":"string"},"description":{"type":"string"}},"required":["category","description"]}}},"required":["new_features","improvements","bug_fixes","other_changes"]}'

      - name: Process output
        id: process
        if: steps.analyze.outputs.has_changes == 'true'
        env:
          AI_OUTPUT: ${{ steps.ai_changelog.outputs.structured_output }}
        run: |
          # Validate AI output - workflow fails if invalid (no fallback per spec)
          if [ -z "$AI_OUTPUT" ] || ! echo "$AI_OUTPUT" | jq -e . >/dev/null 2>&1; then
            echo "ERROR: AI output is empty or invalid JSON"
            echo "$AI_OUTPUT"
            exit 1
          fi

          # Store raw JSON to file for future context
          echo "$AI_OUTPUT" > changelog.json

          # Format changelog as markdown
          format_section() {
            local section_name="$1"
            local json_key="$2"
            local items=$(echo "$AI_OUTPUT" | jq -r ".$json_key // [] | .[] | \"- [\\(.category)] \\(.description)\"")
            if [ -n "$items" ]; then
              echo "## $section_name"
              echo "$items"
              echo ""
            fi
          }

          {
            format_section "New Features" "new_features"
            format_section "Bug Fixes" "bug_fixes"
            format_section "Improvements" "improvements"
            format_section "Other Changes" "other_changes"
          } > changelog_formatted.md

          FORMATTED_CHANGELOG=$(cat changelog_formatted.md)

          # Read existing changelog from file (written by analyze step)
          EXISTING_CHANGELOG=""
          [ -f existing_changelog.txt ] && EXISTING_CHANGELOG=$(cat existing_changelog.txt)

          # Discord changelog (truncate if >1800 chars to leave room for header)
          DISCORD_CHANGELOG="$FORMATTED_CHANGELOG"
          if [ ${#DISCORD_CHANGELOG} -gt 1800 ]; then
            TRUNCATED="${DISCORD_CHANGELOG:0:1750}..."
            printf '%s\n\n[See full changelog on GitHub](https://github.com/${{ github.repository }}/releases/tag/dev-latest)' "$TRUNCATED" > discord_changelog.txt
          else
            echo "$DISCORD_CHANGELOG" > discord_changelog.txt
          fi

          # GitHub changelog (prepend to existing with separator)
          if [ -n "$EXISTING_CHANGELOG" ]; then
            printf '%s\n---\n\n%s' "$FORMATTED_CHANGELOG" "$EXISTING_CHANGELOG" > github_changelog.txt
          else
            echo "$FORMATTED_CHANGELOG" > github_changelog.txt
          fi

      - name: Upload changelog artifacts
        if: steps.analyze.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: changelog-files
          path: |
            changelog.json
            discord_changelog.txt
            github_changelog.txt
          retention-days: 1

  build:
    needs: changelog
    if: needs.changelog.outputs.has_changes == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: microsoft/setup-msbuild@v2

      - name: Build Mod and Proxy
        if: needs.changelog.outputs.build_mod == 'true'
        shell: pwsh
        run: |
          MSBuild.exe "Mod/Mod.vcxproj" /p:Configuration="Release Dev" /p:Platform=x64 /p:PlatformToolset=v143 /p:SolutionDir="$PWD/"
          if ($LASTEXITCODE -ne 0) { throw "Mod build failed" }
          MSBuild.exe "Proxy/Proxy.vcxproj" /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:SolutionDir="$PWD/"
          if ($LASTEXITCODE -ne 0) { throw "Proxy build failed" }

      - name: Build Launcher
        if: needs.changelog.outputs.build_launcher == 'true'
        shell: pwsh
        run: |
          MSBuild.exe "Launcher/Launcher.vcxproj" /p:Configuration="Release Dev" /p:Platform=x64 /p:PlatformToolset=v143 /p:SolutionDir="$PWD/"
          if ($LASTEXITCODE -ne 0) { throw "Launcher build failed" }

      - name: Package
        shell: pwsh
        env:
          MOD_CHANGED: ${{ needs.changelog.outputs.build_mod }}
          LAUNCHER_CHANGED: ${{ needs.changelog.outputs.build_launcher }}
        run: |
          New-Item -ItemType Directory -Force -Path "release_files" | Out-Null

          if ($env:MOD_CHANGED -eq "true") {
            Copy-Item "bin/HSEnhancer.dll" "release_files/"
            New-Item -ItemType Directory -Force -Path "manual_install" | Out-Null
            Copy-Item "Manual_Install.txt" "manual_install/README.txt"
            Copy-Item "bin/dwmapi.dll" "manual_install/"
            Copy-Item "bin/HSEnhancer.dll" "manual_install/"
            Compress-Archive -Path "manual_install/*" -DestinationPath "release_files/HSEnhancer.zip" -Force
          }

          if ($env:LAUNCHER_CHANGED -eq "true") {
            Copy-Item "bin/HSEnhancerLauncherDev.exe" "release_files/HSEnhancerLauncher.exe"
          }

      - uses: actions/upload-artifact@v6
        if: needs.changelog.outputs.has_changes == 'true'
        with:
          name: release-files
          path: release_files/
          retention-days: 1

  release:
    needs: [changelog, build]
    if: needs.changelog.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MOD_CHANGED: ${{ needs.changelog.outputs.build_mod }}
      LAUNCHER_CHANGED: ${{ needs.changelog.outputs.build_launcher }}
      CURRENT_COMMIT: ${{ needs.changelog.outputs.current_commit }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-files
          path: release_files/

      - uses: actions/download-artifact@v7
        with:
          name: changelog-files
          path: changelog_files/

      - name: Publish release
        run: |
          GITHUB_CHANGELOG=$(cat changelog_files/github_changelog.txt 2>/dev/null || echo "")

          {
            echo "> [!WARNING]"
            echo "> **Development Build** — May contain bugs or incomplete features"
            echo ""
            [ -n "$GITHUB_CHANGELOG" ] && printf "%s\n\n" "$GITHUB_CHANGELOG"
            echo "## Installation"
            echo ""
            echo "<details>"
            echo "<summary><b>Quick Install (Recommended)</b></summary>"
            echo ""
            echo "1. Download \`HSEnhancer.dll\`"
            echo "2. Drag onto the Launcher executable"
            echo ""
            echo "</details>"
            echo ""
            echo "<details>"
            echo "<summary><b>Manual Install</b></summary>"
            echo ""
            echo "1. Download \`HSEnhancer.zip\`"
            echo "2. Extract and follow instructions in README"
            echo ""
            echo "</details>"
            echo ""
            echo "<!-- LAST_NOTIFIED_COMMIT: $CURRENT_COMMIT -->"
          } > release_body.md

          if gh release view dev-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit dev-latest --repo "${{ github.repository }}" --notes-file release_body.md
          else
            gh release create dev-latest --repo "${{ github.repository }}" --title "Dev Build" --notes-file release_body.md --prerelease
          fi

          [ "$MOD_CHANGED" == "true" ] && [ -f "release_files/HSEnhancer.dll" ] && \
            gh release upload dev-latest release_files/HSEnhancer.dll release_files/HSEnhancer.zip --repo "${{ github.repository }}" --clobber
          [ "$LAUNCHER_CHANGED" == "true" ] && [ -f "release_files/HSEnhancerLauncher.exe" ] && \
            gh release upload dev-latest release_files/HSEnhancerLauncher.exe --repo "${{ github.repository }}" --clobber
          true

      - name: Discord notification
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -z "$WEBHOOK_URL" ] && exit 0

          DISCORD_CHANGELOG=$(cat changelog_files/discord_changelog.txt 2>/dev/null || echo "")
          [ -z "$DISCORD_CHANGELOG" ] && exit 0

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/dev-latest"

          jq -n \
            --arg content "<@&1426630164053360640>"$'\n'"# New Dev Build"$'\n\n'"$DISCORD_CHANGELOG" \
            --arg url "$RELEASE_URL" \
            '{content: $content, components: [{type: 1, components: [{type: 2, style: 5, label: "Download", url: $url}]}], with_components: true}' | \
            curl -s -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK_URL"

      - name: Notify failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -z "$WEBHOOK_URL" ] && exit 0
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          jq -n --arg content "⚠️ **Dev Build Failed**"$'\n\n'"View logs: <$RUN_URL>" '{content: $content}' | \
            curl -s -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK_URL"

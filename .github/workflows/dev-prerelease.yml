name: Dev Pre-Release

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [main]
    paths: ['Mod/**', 'Launcher/**', 'Proxy/**', 'ext/**']

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mod_changed: ${{ steps.analyze.outputs.mod_changed }}
      launcher_changed: ${{ steps.analyze.outputs.launcher_changed }}
      mod_changelog: ${{ steps.process.outputs.mod_changelog }}
      launcher_changelog: ${{ steps.process.outputs.launcher_changelog }}
      current_commit: ${{ steps.analyze.outputs.current_commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Analyze changes
        id: analyze
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get last notified commit for incremental changelog
          LAST_NOTIFIED=$(gh release view dev-latest --repo "${{ github.repository }}" --json body -q '.body' 2>/dev/null | \
            grep -oP '<!-- LAST_NOTIFIED_COMMIT: \K[a-f0-9]+(?= -->)' || echo "")

          # Determine base reference for changelog (what's new since last notification)
          if [ -n "$LAST_NOTIFIED" ] && git cat-file -e "$LAST_NOTIFIED" 2>/dev/null; then
            BASE_REF="$LAST_NOTIFIED"
          else
            BASE_REF="origin/main"
          fi

          # Detect changes using unified BASE_REF
          MOD_CHANGED=$(git diff --name-only "$BASE_REF"..HEAD -- 'Mod/**' 'Proxy/**' 'ext/**' | grep -q . && echo true || echo false)
          LAUNCHER_CHANGED=$(git diff --name-only "$BASE_REF"..HEAD -- 'Launcher/**' 'ext/**' | grep -q . && echo true || echo false)

          echo "mod_changed=$MOD_CHANGED" >> $GITHUB_OUTPUT
          echo "launcher_changed=$LAUNCHER_CHANGED" >> $GITHUB_OUTPUT
          echo "current_commit=${{ github.sha }}" >> $GITHUB_OUTPUT

          # Generate component-specific diffs and commits
          [ "$MOD_CHANGED" == "true" ] && {
            git diff "$BASE_REF"..HEAD --name-only -- 'Mod/**' ':!Mod/SDK/**' > mod_files.txt
            git diff "$BASE_REF"..HEAD -- 'Mod/**' 'ext/**' ':!Mod/SDK/**' > mod_changes.diff
            git log "$BASE_REF"..HEAD --pretty=format:"- %s" --no-merges -- 'Mod/**' 'Proxy/**' 'ext/**' > mod_commits.txt
          }
          [ "$LAUNCHER_CHANGED" == "true" ] && {
            git diff "$BASE_REF"..HEAD --name-only -- 'Launcher/**' > launcher_files.txt
            git diff "$BASE_REF"..HEAD -- 'Launcher/**' > launcher_changes.diff
            git log "$BASE_REF"..HEAD --pretty=format:"- %s" --no-merges -- 'Launcher/**' 'ext/**' > launcher_commits.txt
          }

      - name: Setup main branch reference
        run: |
          git worktree add main_branch origin/main

      - name: Generate changelog
        id: ai_changelog
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Generate changelog for Half Sword Enhancer (game mod). Audience: gamers, NOT programmers.

            **Status:** Mod: ${{ steps.analyze.outputs.mod_changed }}, Launcher: ${{ steps.analyze.outputs.launcher_changed }}
            **Files:** mod_changes.diff, launcher_changes.diff, mod_commits.txt, launcher_commits.txt
            **Verification:** main_branch/ contains stable code - check here before claiming anything is "new"

            ## CRITICAL RULES
            1. **Before claiming "new feature"**: Search main_branch/ first. If it exists there, it's NOT new.
            2. **Never infer features from internal code**: Managers, utilities, refactors = don't mention.
            3. **Only include user-visible changes**: crashes fixed, UI changes, new menu options.
            4. **When in doubt, OMIT**.

            ## EXAMPLES OF WHAT NOT TO DO
            ❌ Saw ProcessRebindEvent() → "You can rebind hotkeys" (WRONG: no UI added)
            ❌ Saw cache optimization → "Faster menu" (WRONG: imperceptible)
            ❌ Saw refactoring → "Improved X" (WRONG: internal change)

            ## OUTPUT
            JSON: {"mod": "changelog or empty", "launcher": "changelog or empty"}
            Headers: ## New Features, ## Bug Fixes, ## Improvements
            Empty "" if no user-facing changes.
          claude_args: |
            --model claude-sonnet-4-5-20250929
            --allowedTools "Read,Glob,Grep,Bash(cat:*),Bash(head:*),Bash(ls:*)"
            --json-schema '{"type":"object","properties":{"mod":{"type":"string"},"launcher":{"type":"string"}},"required":["mod","launcher"]}'
        continue-on-error: true

      - name: Process output
        id: process
        env:
          AI_OUTPUT: ${{ steps.ai_changelog.outputs.structured_output }}
        run: |
          if [ -n "$AI_OUTPUT" ] && echo "$AI_OUTPUT" | jq -e . >/dev/null 2>&1; then
            MOD_CL=$(echo "$AI_OUTPUT" | jq -r '.mod // empty')
            LAUNCHER_CL=$(echo "$AI_OUTPUT" | jq -r '.launcher // empty')
          else
            MOD_CL=""
            LAUNCHER_CL=""
          fi

          # Component-specific fallback
          [ -z "$MOD_CL" ] && [ -f mod_commits.txt ] && MOD_CL=$(head -5 mod_commits.txt)
          [ -z "$LAUNCHER_CL" ] && [ -f launcher_commits.txt ] && LAUNCHER_CL=$(head -5 launcher_commits.txt)

          { echo "mod_changelog<<EOF"; echo "$MOD_CL"; echo "EOF"; } >> $GITHUB_OUTPUT
          { echo "launcher_changelog<<EOF"; echo "$LAUNCHER_CL"; echo "EOF"; } >> $GITHUB_OUTPUT

      - name: Cleanup worktree
        if: always()
        run: git worktree remove main_branch --force 2>/dev/null || true

  build:
    needs: changelog
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: microsoft/setup-msbuild@v2

      - name: Build Mod and Proxy
        if: needs.changelog.outputs.mod_changed == 'true'
        shell: pwsh
        run: |
          MSBuild.exe "Mod/Mod.vcxproj" /p:Configuration="Release Dev" /p:Platform=x64 /p:PlatformToolset=v143 /p:SolutionDir="$PWD/"
          if ($LASTEXITCODE -ne 0) { throw "Mod build failed" }
          MSBuild.exe "Proxy/Proxy.vcxproj" /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:SolutionDir="$PWD/"
          if ($LASTEXITCODE -ne 0) { throw "Proxy build failed" }

      - name: Build Launcher
        if: needs.changelog.outputs.launcher_changed == 'true'
        shell: pwsh
        run: |
          MSBuild.exe "Launcher/Launcher.vcxproj" /p:Configuration="Release Dev" /p:Platform=x64 /p:PlatformToolset=v143 /p:SolutionDir="$PWD/"
          if ($LASTEXITCODE -ne 0) { throw "Launcher build failed" }

      - name: Package
        shell: pwsh
        env:
          MOD_CHANGED: ${{ needs.changelog.outputs.mod_changed }}
          LAUNCHER_CHANGED: ${{ needs.changelog.outputs.launcher_changed }}
        run: |
          New-Item -ItemType Directory -Force -Path "release_files" | Out-Null

          if ($env:MOD_CHANGED -eq "true") {
            Copy-Item "bin/HSEnhancer.dll" "release_files/"
            New-Item -ItemType Directory -Force -Path "manual_install" | Out-Null
            Copy-Item "Manual_Install.txt" "manual_install/README.txt"
            Copy-Item "bin/dwmapi.dll" "manual_install/"
            Copy-Item "bin/HSEnhancer.dll" "manual_install/"
            Compress-Archive -Path "manual_install/*" -DestinationPath "release_files/HSEnhancer.zip" -Force
          }

          if ($env:LAUNCHER_CHANGED -eq "true") {
            Copy-Item "bin/HSEnhancerLauncherDev.exe" "release_files/HSEnhancerLauncher.exe"
          }

      - uses: actions/upload-artifact@v6
        if: needs.changelog.outputs.mod_changed == 'true' || needs.changelog.outputs.launcher_changed == 'true'
        with:
          name: release-files
          path: release_files/
          retention-days: 1

  release:
    needs: [changelog, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MOD_CHANGED: ${{ needs.changelog.outputs.mod_changed }}
      LAUNCHER_CHANGED: ${{ needs.changelog.outputs.launcher_changed }}
      MOD_CHANGELOG: ${{ needs.changelog.outputs.mod_changelog }}
      LAUNCHER_CHANGELOG: ${{ needs.changelog.outputs.launcher_changelog }}
      CURRENT_COMMIT: ${{ needs.changelog.outputs.current_commit }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-files
          path: release_files/

      - name: Publish release
        run: |
          # Extract existing changelogs from release body (accumulative)
          EXISTING_BODY=$(gh release view dev-latest --repo "${{ github.repository }}" --json body -q '.body' 2>/dev/null || echo "")
          EXISTING_MOD=$(echo "$EXISTING_BODY" | sed -n '/^## Mod$/,/^## /p' | tail -n +2 | sed '$d')
          EXISTING_LAUNCHER=$(echo "$EXISTING_BODY" | sed -n '/^## Launcher$/,/^## /p' | tail -n +2 | sed '$d')

          {
            echo "> [!WARNING]"
            echo "> **Development Build** — May contain bugs or incomplete features"
            echo ""
            echo "## Mod"
            echo ""
            [ -n "$MOD_CHANGELOG" ] && printf "%s\n" "$MOD_CHANGELOG"
            [ -n "$EXISTING_MOD" ] && printf "%s\n" "$EXISTING_MOD"
            echo ""
            echo "## Launcher"
            echo ""
            [ -n "$LAUNCHER_CHANGELOG" ] && printf "%s\n" "$LAUNCHER_CHANGELOG"
            [ -n "$EXISTING_LAUNCHER" ] && printf "%s\n" "$EXISTING_LAUNCHER"
            echo ""
            echo "## Installation"
            echo ""
            echo "<details>"
            echo "<summary><b>Quick Install (Recommended)</b></summary>"
            echo ""
            echo "1. Download \`HSEnhancer.dll\`"
            echo "2. Drag onto the Launcher executable"
            echo ""
            echo "</details>"
            echo ""
            echo "<details>"
            echo "<summary><b>Manual Install</b></summary>"
            echo ""
            echo "1. Download \`HSEnhancer.zip\`"
            echo "2. Extract and follow instructions in README"
            echo ""
            echo "</details>"
            echo ""
            echo "<!-- LAST_NOTIFIED_COMMIT: $CURRENT_COMMIT -->"
          } > release_body.md

          if gh release view dev-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit dev-latest --repo "${{ github.repository }}" --notes-file release_body.md
          else
            gh release create dev-latest --repo "${{ github.repository }}" --title "Dev Build" --notes-file release_body.md --prerelease
          fi

          [ "$MOD_CHANGED" == "true" ] && [ -f "release_files/HSEnhancer.dll" ] && \
            gh release upload dev-latest release_files/HSEnhancer.dll release_files/HSEnhancer.zip --repo "${{ github.repository }}" --clobber
          [ "$LAUNCHER_CHANGED" == "true" ] && [ -f "release_files/HSEnhancerLauncher.exe" ] && \
            gh release upload dev-latest release_files/HSEnhancerLauncher.exe --repo "${{ github.repository }}" --clobber
          true

      - name: Discord notification
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -z "$WEBHOOK_URL" ] && exit 0

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/dev-latest"

          # Build message from changelog (already contains only new changes based on commit tracking)
          MSG=""
          [ "$MOD_CHANGED" == "true" ] && [ -n "$MOD_CHANGELOG" ] && MSG+="## Mod"$'\n'"$MOD_CHANGELOG"$'\n\n'
          [ "$LAUNCHER_CHANGED" == "true" ] && [ -n "$LAUNCHER_CHANGELOG" ] && MSG+="## Launcher"$'\n'"$LAUNCHER_CHANGELOG"$'\n\n'

          # Only send notification if there's content
          if [ -n "$MSG" ]; then
            jq -n \
              --arg content "<@&1426630164053360640>"$'\n'"# New Dev Build"$'\n\n'"$MSG" \
              --arg url "$RELEASE_URL" \
              '{content: $content, components: [{type: 1, components: [{type: 2, style: 5, label: "Download", url: $url}]}], with_components: true}' | \
              curl -s -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK_URL"
          fi

      - name: Notify failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -z "$WEBHOOK_URL" ] && exit 0
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          jq -n --arg content "⚠️ **Dev Build Failed**"$'\n\n'"View logs: <$RUN_URL>" '{content: $content}' | \
            curl -s -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK_URL"

name: Dev Pre-Release

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [main]
    paths: ['Mod/**', 'Launcher/**', 'Proxy/**', 'ext/**']

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build_mod: ${{ steps.analyze.outputs.build_mod }}
      build_launcher: ${{ steps.analyze.outputs.build_launcher }}
      has_changes: ${{ steps.analyze.outputs.has_changes }}
      discord_changelog: ${{ steps.process.outputs.discord_changelog }}
      github_changelog: ${{ steps.process.outputs.github_changelog }}
      changelog_json: ${{ steps.process.outputs.changelog_json }}
      current_commit: ${{ steps.analyze.outputs.current_commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Analyze changes
        id: analyze
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch all refs to ensure LAST_NOTIFIED_COMMIT is available
          git fetch origin --quiet

          # Get release body for extracting context
          RELEASE_BODY=$(gh release view dev-latest --repo "${{ github.repository }}" --json body -q '.body' 2>/dev/null || echo "")

          # Get last notified commit for incremental changelog
          LAST_NOTIFIED=$(echo "$RELEASE_BODY" | grep -oP '<!-- LAST_NOTIFIED_COMMIT: \K[a-f0-9]+(?= -->)' || echo "")

          # Extract previous changelog JSON for classification context
          PREV_CHANGELOG_JSON=$(echo "$RELEASE_BODY" | sed -n '/<!-- CHANGELOG_JSON_START -->/,/<!-- CHANGELOG_JSON_END -->/p' | sed '1d;$d' || echo "")

          # Extract existing accumulated changelog (between warning and Installation)
          EXISTING_CHANGELOG=$(echo "$RELEASE_BODY" | sed -n '/^> \[!WARNING\]/,/^## Installation$/p' | tail -n +4 | sed '$d' || echo "")

          # Determine base reference for changelog (what's new since last notification)
          echo "LAST_NOTIFIED: $LAST_NOTIFIED"
          if [ -n "$LAST_NOTIFIED" ] && git merge-base --is-ancestor "$LAST_NOTIFIED" HEAD 2>/dev/null; then
            BASE_REF="$LAST_NOTIFIED"
            echo "Using incremental changelog from $LAST_NOTIFIED"
          else
            BASE_REF="origin/main"
            echo "Using full changelog from origin/main (LAST_NOTIFIED not found or not ancestor)"
          fi
          echo "BASE_REF: $BASE_REF"

          # Detect changes using unified BASE_REF
          MOD_CHANGED=$(git diff --name-only "$BASE_REF"..HEAD -- 'Mod/**' 'Proxy/**' | grep -q . && echo true || echo false)
          LAUNCHER_CHANGED=$(git diff --name-only "$BASE_REF"..HEAD -- 'Launcher/**' | grep -q . && echo true || echo false)
          EXT_CHANGED=$(git diff --name-only "$BASE_REF"..HEAD -- 'ext/**' | grep -q . && echo true || echo false)

          # Pre-compute build triggers (ext/ triggers both)
          BUILD_MOD=$([[ "$MOD_CHANGED" == "true" || "$EXT_CHANGED" == "true" ]] && echo true || echo false)
          BUILD_LAUNCHER=$([[ "$LAUNCHER_CHANGED" == "true" || "$EXT_CHANGED" == "true" ]] && echo true || echo false)
          HAS_CHANGES=$([[ "$BUILD_MOD" == "true" || "$BUILD_LAUNCHER" == "true" ]] && echo true || echo false)

          echo "build_mod=$BUILD_MOD" >> $GITHUB_OUTPUT
          echo "build_launcher=$BUILD_LAUNCHER" >> $GITHUB_OUTPUT
          echo "has_changes=$HAS_CHANGES" >> $GITHUB_OUTPUT
          echo "current_commit=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT

          # Generate commits with hash for correlation
          git log "$BASE_REF"..HEAD --pretty=format:"- %h: %s" --no-merges \
            -- 'Mod/**' 'Launcher/**' 'Proxy/**' 'ext/**' ':!Mod/SDK/**' > commits.txt

          # Detect large files (>500 lines changed) for exclusion
          LARGE_FILES=$(git diff "$BASE_REF"..HEAD --numstat -- 'Mod/**' 'Launcher/**' 'Proxy/**' 'ext/**' | \
            awk '$1+$2 > 500 {print ":!" $3}')

          # Generate component-specific diffs (skip ext/ - rarely needs changelog entries)
          git log "$BASE_REF"..HEAD --no-merges --format=$'\n=== %h ===' -p \
            -- 'Mod/**' ':!Mod/SDK/**' ':!*.vcxproj*' ':!*.rc' ':!*.filters' \
            $LARGE_FILES > mod.diff || true

          git log "$BASE_REF"..HEAD --no-merges --format=$'\n=== %h ===' -p \
            -- 'Launcher/**' ':!*.vcxproj*' ':!*.rc' ':!*.filters' \
            $LARGE_FILES > launcher.diff || true

          git log "$BASE_REF"..HEAD --no-merges --format=$'\n=== %h ===' -p \
            -- 'Proxy/**' ':!*.vcxproj*' ':!*.rc' ':!*.filters' \
            $LARGE_FILES > proxy.diff || true

          # Generate reverse diff (main → current) to show what exists in main
          # This helps classify: if code doesn't exist in main, it's NEW
          git diff HEAD...origin/main --stat -- 'Mod/**' 'Launcher/**' 'Proxy/**' ':!Mod/SDK/**' ':!*.vcxproj*' > reverse_diff_summary.txt || true

          # Export outputs as JSON strings
          echo "commits_content=$(cat commits.txt 2>/dev/null | jq -Rs . || echo '""')" >> $GITHUB_OUTPUT
          echo "prev_changelog_json=$(echo "$PREV_CHANGELOG_JSON" | jq -Rs . || echo '""')" >> $GITHUB_OUTPUT
          { echo "existing_changelog<<EOFCHANGELOG"; echo "$EXISTING_CHANGELOG"; echo "EOFCHANGELOG"; } >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: ai_changelog
        if: steps.analyze.outputs.has_changes == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            <role>
            Generate STRUCTURED patch notes for Half Sword Enhancer, a mod for the medieval combat game Half Sword.
            The mod adds an in-game menu (INSERT key) with spawn controls, equipment management, and gameplay tweaks.
            Write for gamers, not developers. Keep descriptions concise (Discord has 2000 char limit).
            </role>

            <commits>
            ${{ fromJSON(steps.analyze.outputs.commits_content) }}
            </commits>

            <resources>
            - mod.diff: Mod project diffs with `=== HASH ===` markers
            - launcher.diff: Launcher project diffs with `=== HASH ===` markers
            - proxy.diff: Proxy project diffs with `=== HASH ===` markers
            - reverse_diff_summary.txt: Shows what files exist in main (helps determine NEW vs IMPROVEMENT)
            - git show origin/main:PATH: Shows file content in stable version
            </resources>

            <previous_changelog_context>
            Previous changelog entries already announced to users (use for classification):
            ${{ fromJSON(steps.analyze.outputs.prev_changelog_json) }}
            </previous_changelog_context>

            <classification_logic>
            HYBRID CLASSIFICATION using TWO contexts:

            1. REVERSE DIFF CONTEXT (main state):
               - Read reverse_diff_summary.txt to see what exists in main
               - If code/feature DOESN'T EXIST in main → NEW FEATURE
               - If code/feature EXISTS in main and is modified → IMPROVEMENT

            2. PREVIOUS CHANGELOG CONTEXT (already announced):
               - If something was announced as "New" in previous changelog AND this build improves it → IMPROVEMENT
               - If something breaks (even if new in this PR) → BUG FIX (always)

            PRIORITY: Bug Fix > based on diff analysis > based on previous changelog

            IMPORTANT: Analyze the actual diff content, not just commit prefixes.
            "feat: fix spawn crash" should be classified as BUG FIX based on content.
            </classification_logic>

            <process>
            1. Read the diffs to understand what actually changed
            2. Check reverse_diff_summary.txt to see what exists in main
            3. Check previous changelog to see what was already announced
            4. Classify each change using hybrid logic above
            5. Merge multi-commit features into single entries
            6. Return structured JSON (not markdown)
            </process>

            <categories_available>
            - Spawner: NPC/item spawning, clearing objects
            - Graphics: Visual settings, render scale, quality options
            - Player: Health, strength, abilities, body modifications
            - Controls: Keybinds, menu toggle, input handling
            - Equipment: Weapons, armor, loadout management
            - World: Time, weather, environment manipulation
            - NPCs: Enemy behavior, AI modifications
            - Launcher: Auto-updates, installation, startup
            - Mod: General mod functionality, initialization
            - Internal: Code changes with no direct user impact (refactors, optimizations)
            </categories_available>

            <writing_rules>
            1. User impact, not implementation: "Fixed crash when alt-tabbing" not "Fixed SwapChain recreation"
            2. Use backticks for feature names: `Infinite Health`, `Spawn NPC`
            3. One sentence per entry, be specific
            4. No technical terms: avoid GameHook, ProcessEvent, UObject, etc.
            5. Keep it CONCISE - Discord has 2000 character limit total
            </writing_rules>

            <output_schema>
            Return a JSON object with this EXACT structure:
            {
              "new_features": [
                {"category": "Spawner", "description": "Added option to spawn multiple NPCs at once"}
              ],
              "improvements": [
                {"category": "Controls", "description": "Menu now opens faster"}
              ],
              "bug_fixes": [
                {"category": "Graphics", "description": "Fixed flickering in DirectX 12 mode"}
              ],
              "other_changes": [
                {"category": "Internal", "description": "Code optimization for better performance"}
              ]
            }

            RULES:
            - Each array can be empty [] if no changes in that category
            - "category" must be one of the categories_available above
            - "description" should be user-friendly, concise text
            - Omit arrays only if truly empty
            </output_schema>
          claude_args: |
            --model claude-opus-4-5-20251101
            --allowedTools "Read,Glob,Grep,Task,Bash(cat:*),Bash(head:*),Bash(ls:*),Bash(git show:*)"
            --json-schema '{"type":"object","properties":{"new_features":{"type":"array","items":{"type":"object","properties":{"category":{"type":"string"},"description":{"type":"string"}},"required":["category","description"]}},"improvements":{"type":"array","items":{"type":"object","properties":{"category":{"type":"string"},"description":{"type":"string"}},"required":["category","description"]}},"bug_fixes":{"type":"array","items":{"type":"object","properties":{"category":{"type":"string"},"description":{"type":"string"}},"required":["category","description"]}},"other_changes":{"type":"array","items":{"type":"object","properties":{"category":{"type":"string"},"description":{"type":"string"}},"required":["category","description"]}}},"required":["new_features","improvements","bug_fixes","other_changes"]}'

      - name: Process output
        id: process
        env:
          AI_OUTPUT: ${{ steps.ai_changelog.outputs.structured_output }}
          EXISTING_CHANGELOG: ${{ steps.analyze.outputs.existing_changelog }}
        run: |
          # Validate AI output - workflow fails if invalid (no fallback per spec)
          if [ -z "$AI_OUTPUT" ] || ! echo "$AI_OUTPUT" | jq -e . >/dev/null 2>&1; then
            echo "ERROR: AI output is empty or invalid JSON"
            echo "$AI_OUTPUT"
            exit 1
          fi

          # Store raw JSON for future context
          echo "changelog_json<<EOFJSON" >> $GITHUB_OUTPUT
          echo "$AI_OUTPUT" >> $GITHUB_OUTPUT
          echo "EOFJSON" >> $GITHUB_OUTPUT

          # Format changelog as markdown
          format_section() {
            local section_name="$1"
            local json_key="$2"
            local items=$(echo "$AI_OUTPUT" | jq -r ".$json_key // [] | .[] | \"- [\\(.category)] \\(.description)\"")
            if [ -n "$items" ]; then
              echo "## $section_name"
              echo "$items"
              echo ""
            fi
          }

          {
            format_section "New Features" "new_features"
            format_section "Bug Fixes" "bug_fixes"
            format_section "Improvements" "improvements"
            format_section "Other Changes" "other_changes"
          } > changelog_formatted.md

          FORMATTED_CHANGELOG=$(cat changelog_formatted.md)

          # Discord changelog (truncate if >1800 chars to leave room for header)
          DISCORD_CHANGELOG="$FORMATTED_CHANGELOG"
          if [ ${#DISCORD_CHANGELOG} -gt 1800 ]; then
            DISCORD_CHANGELOG="${DISCORD_CHANGELOG:0:1750}...

[See full changelog on GitHub](https://github.com/${{ github.repository }}/releases/tag/dev-latest)"
          fi

          # GitHub changelog (prepend to existing with separator)
          if [ -n "$EXISTING_CHANGELOG" ]; then
            GITHUB_CHANGELOG="$FORMATTED_CHANGELOG
---

$EXISTING_CHANGELOG"
          else
            GITHUB_CHANGELOG="$FORMATTED_CHANGELOG"
          fi

          # Export outputs
          { echo "discord_changelog<<EOFDISCORD"; echo "$DISCORD_CHANGELOG"; echo "EOFDISCORD"; } >> $GITHUB_OUTPUT
          { echo "github_changelog<<EOFGITHUB"; echo "$GITHUB_CHANGELOG"; echo "EOFGITHUB"; } >> $GITHUB_OUTPUT

  build:
    needs: changelog
    if: needs.changelog.outputs.has_changes == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: microsoft/setup-msbuild@v2

      - name: Build Mod and Proxy
        if: needs.changelog.outputs.build_mod == 'true'
        shell: pwsh
        run: |
          MSBuild.exe "Mod/Mod.vcxproj" /p:Configuration="Release Dev" /p:Platform=x64 /p:PlatformToolset=v143 /p:SolutionDir="$PWD/"
          if ($LASTEXITCODE -ne 0) { throw "Mod build failed" }
          MSBuild.exe "Proxy/Proxy.vcxproj" /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:SolutionDir="$PWD/"
          if ($LASTEXITCODE -ne 0) { throw "Proxy build failed" }

      - name: Build Launcher
        if: needs.changelog.outputs.build_launcher == 'true'
        shell: pwsh
        run: |
          MSBuild.exe "Launcher/Launcher.vcxproj" /p:Configuration="Release Dev" /p:Platform=x64 /p:PlatformToolset=v143 /p:SolutionDir="$PWD/"
          if ($LASTEXITCODE -ne 0) { throw "Launcher build failed" }

      - name: Package
        shell: pwsh
        env:
          MOD_CHANGED: ${{ needs.changelog.outputs.build_mod }}
          LAUNCHER_CHANGED: ${{ needs.changelog.outputs.build_launcher }}
        run: |
          New-Item -ItemType Directory -Force -Path "release_files" | Out-Null

          if ($env:MOD_CHANGED -eq "true") {
            Copy-Item "bin/HSEnhancer.dll" "release_files/"
            New-Item -ItemType Directory -Force -Path "manual_install" | Out-Null
            Copy-Item "Manual_Install.txt" "manual_install/README.txt"
            Copy-Item "bin/dwmapi.dll" "manual_install/"
            Copy-Item "bin/HSEnhancer.dll" "manual_install/"
            Compress-Archive -Path "manual_install/*" -DestinationPath "release_files/HSEnhancer.zip" -Force
          }

          if ($env:LAUNCHER_CHANGED -eq "true") {
            Copy-Item "bin/HSEnhancerLauncherDev.exe" "release_files/HSEnhancerLauncher.exe"
          }

      - uses: actions/upload-artifact@v6
        if: needs.changelog.outputs.has_changes == 'true'
        with:
          name: release-files
          path: release_files/
          retention-days: 1

  release:
    needs: [changelog, build]
    if: needs.changelog.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MOD_CHANGED: ${{ needs.changelog.outputs.build_mod }}
      LAUNCHER_CHANGED: ${{ needs.changelog.outputs.build_launcher }}
      DISCORD_CHANGELOG: ${{ needs.changelog.outputs.discord_changelog }}
      GITHUB_CHANGELOG: ${{ needs.changelog.outputs.github_changelog }}
      CHANGELOG_JSON: ${{ needs.changelog.outputs.changelog_json }}
      CURRENT_COMMIT: ${{ needs.changelog.outputs.current_commit }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-files
          path: release_files/

      - name: Publish release
        run: |
          {
            echo "> [!WARNING]"
            echo "> **Development Build** — May contain bugs or incomplete features"
            echo ""
            [ -n "$GITHUB_CHANGELOG" ] && printf "%s\n\n" "$GITHUB_CHANGELOG"
            echo "## Installation"
            echo ""
            echo "<details>"
            echo "<summary><b>Quick Install (Recommended)</b></summary>"
            echo ""
            echo "1. Download \`HSEnhancer.dll\`"
            echo "2. Drag onto the Launcher executable"
            echo ""
            echo "</details>"
            echo ""
            echo "<details>"
            echo "<summary><b>Manual Install</b></summary>"
            echo ""
            echo "1. Download \`HSEnhancer.zip\`"
            echo "2. Extract and follow instructions in README"
            echo ""
            echo "</details>"
            echo ""
            echo "<!-- LAST_NOTIFIED_COMMIT: $CURRENT_COMMIT -->"
            echo "<!-- CHANGELOG_JSON_START -->"
            echo "$CHANGELOG_JSON"
            echo "<!-- CHANGELOG_JSON_END -->"
          } > release_body.md

          if gh release view dev-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit dev-latest --repo "${{ github.repository }}" --notes-file release_body.md
          else
            gh release create dev-latest --repo "${{ github.repository }}" --title "Dev Build" --notes-file release_body.md --prerelease
          fi

          [ "$MOD_CHANGED" == "true" ] && [ -f "release_files/HSEnhancer.dll" ] && \
            gh release upload dev-latest release_files/HSEnhancer.dll release_files/HSEnhancer.zip --repo "${{ github.repository }}" --clobber
          [ "$LAUNCHER_CHANGED" == "true" ] && [ -f "release_files/HSEnhancerLauncher.exe" ] && \
            gh release upload dev-latest release_files/HSEnhancerLauncher.exe --repo "${{ github.repository }}" --clobber
          true

      - name: Discord notification
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -z "$WEBHOOK_URL" ] && exit 0
          [ -z "$DISCORD_CHANGELOG" ] && exit 0

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/dev-latest"

          jq -n \
            --arg content "<@&1426630164053360640>"$'\n'"# New Dev Build"$'\n\n'"$DISCORD_CHANGELOG" \
            --arg url "$RELEASE_URL" \
            '{content: $content, components: [{type: 1, components: [{type: 2, style: 5, label: "Download", url: $url}]}], with_components: true}' | \
            curl -s -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK_URL"

      - name: Notify failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -z "$WEBHOOK_URL" ] && exit 0
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          jq -n --arg content "⚠️ **Dev Build Failed**"$'\n\n'"View logs: <$RUN_URL>" '{content: $content}' | \
            curl -s -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK_URL"

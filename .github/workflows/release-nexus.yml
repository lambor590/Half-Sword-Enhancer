name: Release to Nexus Mods

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable GitHub release tag (for example, v0.6.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Download published GitHub release
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid stable release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          release_state="$(gh release view "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --json isDraft,isPrerelease \
            --jq '[.isDraft, .isPrerelease] | @tsv')"
          if [[ "$release_state" != $'false\tfalse' ]]; then
            echo "$RELEASE_TAG must be a published stable GitHub release" >&2
            exit 1
          fi

          mkdir -p release_files
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern HSEnhancer.zip \
            --dir release_files

          test -s release_files/HSEnhancer.zip
          echo "NEXUS_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Publish to Nexus Mods
        uses: Nexus-Mods/upload-action@19da5c91527877cd0bfedc6e6239c911035846a0 # v1.0.0-beta.9
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: 408
          filename: release_files/HSEnhancer.zip
          version: ${{ env.NEXUS_VERSION }}
          display_name: Half Sword Enhancer - Release
          description: Stable version of Half Sword Enhancer. Recommended for most users.
          category: main
          archive_existing_version: true
          primary_mod_manager_download: false
          allow_mod_manager_download: false
          show_requirements_pop_up: false
          update_mod_version: true

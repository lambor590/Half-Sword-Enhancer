name: Experimental

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: >-
          msbuild "Half Sword Enhancer.sln" /t:Rebuild /m
          "/p:Configuration=Release Experimental" /p:Platform=x64 /p:SkipGameInstall=true

      - name: Package
        run: |
          New-Item -ItemType Directory -Force -Path "release_files" | Out-Null
          Copy-Item "bin/HSEnhancerLauncherExperimental.exe" "release_files/HSEnhancerLauncher.exe"
          Copy-Item "bin/HSEnhancer.dll" "release_files/"
          Copy-Item "bin/winmm.dll" "release_files/"
          Copy-Item "bin/main.dll" "release_files/"

          New-Item -ItemType Directory -Force -Path "manual_install/ue4ss/Mods/HSEnhancer/dlls" | Out-Null
          Copy-Item "Manual_Install.txt" "manual_install/README.txt"
          Copy-Item "bin/HSEnhancer.dll" "manual_install/"
          Copy-Item "bin/winmm.dll" "manual_install/"
          Copy-Item "bin/main.dll" "manual_install/ue4ss/Mods/HSEnhancer/dlls/"
          Compress-Archive -Path "manual_install/*" -DestinationPath "release_files/HSEnhancer.zip" -Force

      - name: Publish
        run: |
          $assets = (Get-ChildItem "release_files/*").FullName
          $repo = "${{ github.repository }}"

          gh release view experimental-latest --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload experimental-latest @assets --repo $repo --clobber
          } else {
            gh release create experimental-latest @assets `
              --repo $repo `
              --target "${{ github.sha }}" `
              --title "Experimental Build" `
              --notes "Release notes are maintained manually." `
              --prerelease
          }

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish the experimental release"
          }

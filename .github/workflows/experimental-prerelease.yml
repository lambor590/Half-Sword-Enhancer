name: Experimental Pre-Release

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [main]
    paths: ['Mod/**', 'Launcher/**', 'Proxy/**', 'ext/**']

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build_mod: ${{ steps.analyze.outputs.build_mod }}
      build_launcher: ${{ steps.analyze.outputs.build_launcher }}
      has_changes: ${{ steps.analyze.outputs.has_changes }}
      current_commit: ${{ steps.analyze.outputs.current_commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Analyze changes
        id: analyze
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin --quiet

          RELEASE_BODY=$(gh release view experimental-latest --repo "${{ github.repository }}" --json body -q '.body' 2>/dev/null || echo "")
          LAST_NOTIFIED=$(echo "$RELEASE_BODY" | grep -oP '<!-- LAST_NOTIFIED_COMMIT: \K[a-f0-9]+(?= -->)' || echo "")
          EXISTING_CHANGELOG=$(echo "$RELEASE_BODY" | sed -n '/^> \[!WARNING\]/,/^## Installation$/p' | tail -n +4 | sed '$d' || echo "")

          if [ -n "$LAST_NOTIFIED" ] && git merge-base --is-ancestor "$LAST_NOTIFIED" HEAD 2>/dev/null; then
            BASE_REF="$LAST_NOTIFIED"
          else
            BASE_REF="origin/main"
          fi

          BUILD_MOD=$(git diff --quiet "$BASE_REF"..HEAD -- 'Mod/**' 'Proxy/**' 'ext/**' && echo false || echo true)
          BUILD_LAUNCHER=$(git diff --quiet "$BASE_REF"..HEAD -- 'Launcher/**' 'ext/**' && echo false || echo true)
          HAS_CHANGES=$([[ "$BUILD_MOD" == "true" || "$BUILD_LAUNCHER" == "true" ]] && echo true || echo false)

          echo "build_mod=$BUILD_MOD" >> $GITHUB_OUTPUT
          echo "build_launcher=$BUILD_LAUNCHER" >> $GITHUB_OUTPUT
          echo "has_changes=$HAS_CHANGES" >> $GITHUB_OUTPUT
          echo "current_commit=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT

          git log "$BASE_REF"..HEAD --pretty=format:"- %h: %s" --no-merges \
            -- 'Mod/**' 'Launcher/**' 'Proxy/**' 'ext/**' ':!Mod/SDK/**' > commits.txt

          git log "$BASE_REF"..HEAD --no-merges --format=$'\n=== %h ===' -p \
            -- 'Mod/**' ':!Mod/SDK/**' ':!*.vcxproj*' ':!*.rc' ':!*.filters' > mod.diff || true

          git log "$BASE_REF"..HEAD --no-merges --format=$'\n=== %h ===' -p \
            -- 'Launcher/**' ':!*.vcxproj*' ':!*.rc' ':!*.filters' > launcher.diff || true

          git log "$BASE_REF"..HEAD --no-merges --format=$'\n=== %h ===' -p \
            -- 'Proxy/**' ':!*.vcxproj*' ':!*.rc' ':!*.filters' > proxy.diff || true

          echo "commits_content=$(cat commits.txt 2>/dev/null | jq -Rs . || echo '""')" >> $GITHUB_OUTPUT
          echo "$EXISTING_CHANGELOG" > existing_changelog.txt

      - name: Generate changelog
        id: ai_changelog
        if: steps.analyze.outputs.has_changes == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            <role>
            Generate patch notes for Half Sword Enhancer mod. Write for gamers, not developers.
            Be concise - Discord has 2000 char limit.
            </role>

            <commits>
            ${{ fromJSON(steps.analyze.outputs.commits_content) }}
            </commits>

            <resources>
            Read these files for context:
            - mod.diff: Changes in Mod/ project
            - launcher.diff: Changes in Launcher/ project
            - proxy.diff: Changes in Proxy/ project
            </resources>

            <classification>
            - New feature: New functionality added (new files, new functions, new options)
            - Improvement: Enhanced existing functionality
            - Bug fix: Fixed something that was broken
            - Other: Internal changes, refactors with no user impact
            </classification>

            <categories>
            Spawner, Graphics, Player, Controls, Equipment, World, NPCs, Launcher, Mod, Internal
            </categories>

            <rules>
            1. Describe user impact, not implementation details
            2. Use backticks for feature names: `Infinite Health`
            3. One sentence per entry
            4. Merge multi-commit features into single entries
            </rules>
          claude_args: |
            --model claude-opus-4-5-20251101
            --allowedTools "Read,Glob,Grep,Task,Bash(cat:*),Bash(head:*),Bash(ls:*)"
            --json-schema '{"type":"object","properties":{"new_features":{"type":"array","items":{"type":"object","properties":{"category":{"type":"string"},"description":{"type":"string"}},"required":["category","description"]}},"improvements":{"type":"array","items":{"type":"object","properties":{"category":{"type":"string"},"description":{"type":"string"}},"required":["category","description"]}},"bug_fixes":{"type":"array","items":{"type":"object","properties":{"category":{"type":"string"},"description":{"type":"string"}},"required":["category","description"]}},"other_changes":{"type":"array","items":{"type":"object","properties":{"category":{"type":"string"},"description":{"type":"string"}},"required":["category","description"]}}},"required":["new_features","improvements","bug_fixes","other_changes"]}'

      - name: Process output
        id: process
        if: steps.analyze.outputs.has_changes == 'true'
        env:
          AI_OUTPUT: ${{ steps.ai_changelog.outputs.structured_output }}
        run: |
          echo "$AI_OUTPUT" | jq -e . > changelog.json || { echo "ERROR: Invalid AI output: $AI_OUTPUT"; exit 1; }

          fmt() { local i=$(jq -r ".$2 // [] | .[] | \"- [\\(.category)] \\(.description)\"" changelog.json); [ -n "$i" ] && printf "## %s\n%s\n\n" "$1" "$i" || true; }
          { fmt "New Features" new_features; fmt "Bug Fixes" bug_fixes; fmt "Improvements" improvements; fmt "Other Changes" other_changes; } > changelog_formatted.md

          FORMATTED=$(cat changelog_formatted.md)
          EXISTING=$(cat existing_changelog.txt 2>/dev/null)

          [ ${#FORMATTED} -gt 1800 ] \
            && printf '%s...\n\n[Full changelog](https://github.com/${{ github.repository }}/releases/tag/experimental-latest)' "${FORMATTED:0:1750}" > discord_changelog.txt \
            || echo "$FORMATTED" > discord_changelog.txt

          [ -n "$EXISTING" ] \
            && printf '%s\n---\n\n%s' "$FORMATTED" "$EXISTING" > github_changelog.txt \
            || echo "$FORMATTED" > github_changelog.txt

      - name: Upload changelog artifacts
        if: steps.analyze.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: changelog-files
          path: |
            changelog.json
            discord_changelog.txt
            github_changelog.txt
          retention-days: 1

  build:
    needs: changelog
    if: needs.changelog.outputs.has_changes == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install VS 2026 Build Tools
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/18/stable/vs_buildtools.exe" -OutFile vs_buildtools.exe
          $process = Start-Process -Wait -PassThru -FilePath .\vs_buildtools.exe -ArgumentList "--quiet","--wait","--norestart","--nocache","--add","Microsoft.VisualStudio.Workload.VCTools","--includeRecommended"
          $exitCode = $process.ExitCode
          Write-Host "vs_buildtools.exe exited with code $exitCode"
          if ($exitCode -eq 3010) { Write-Host "Reboot requested - continuing" }
          elseif ($exitCode -ne 0) { throw "VS 2026 Build Tools installation failed (exit code $exitCode)" }

      - uses: microsoft/setup-msbuild@v2

      - name: Build Mod and Proxy
        if: needs.changelog.outputs.build_mod == 'true'
        shell: pwsh
        run: |
          MSBuild.exe "Mod/Mod.vcxproj" /p:Configuration="Release Experimental" /p:Platform=x64 /p:SolutionDir="$PWD/"
          if ($LASTEXITCODE -ne 0) { throw "Mod build failed" }
          MSBuild.exe "Proxy/Proxy.vcxproj" /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="$PWD/"
          if ($LASTEXITCODE -ne 0) { throw "Proxy build failed" }

      - name: Build Launcher
        if: needs.changelog.outputs.build_launcher == 'true'
        shell: pwsh
        run: |
          MSBuild.exe "Launcher/Launcher.vcxproj" /p:Configuration="Release Experimental" /p:Platform=x64 /p:SolutionDir="$PWD/"
          if ($LASTEXITCODE -ne 0) { throw "Launcher build failed" }

      - name: Package
        shell: pwsh
        env:
          MOD_CHANGED: ${{ needs.changelog.outputs.build_mod }}
          LAUNCHER_CHANGED: ${{ needs.changelog.outputs.build_launcher }}
        run: |
          New-Item -ItemType Directory -Force -Path "release_files" | Out-Null

          if ($env:MOD_CHANGED -eq "true") {
            Copy-Item "bin/HSEnhancer.dll" "release_files/"
            Copy-Item "bin/winmm.dll" "release_files/"
            New-Item -ItemType Directory -Force -Path "manual_install" | Out-Null
            Copy-Item "Manual_Install.txt" "manual_install/README.txt"
            Copy-Item "bin/winmm.dll" "manual_install/"
            Copy-Item "bin/HSEnhancer.dll" "manual_install/"
            Compress-Archive -Path "manual_install/*" -DestinationPath "release_files/HSEnhancer.zip" -Force
          }

          if ($env:LAUNCHER_CHANGED -eq "true") {
            Copy-Item "bin/HSEnhancerLauncherExperimental.exe" "release_files/HSEnhancerLauncher.exe"
          }

      - uses: actions/upload-artifact@v6
        if: needs.changelog.outputs.has_changes == 'true'
        with:
          name: release-files
          path: release_files/
          retention-days: 1

  release:
    needs: [changelog, build]
    if: needs.changelog.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MOD_CHANGED: ${{ needs.changelog.outputs.build_mod }}
      LAUNCHER_CHANGED: ${{ needs.changelog.outputs.build_launcher }}
      CURRENT_COMMIT: ${{ needs.changelog.outputs.current_commit }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-files
          path: release_files/

      - uses: actions/download-artifact@v7
        with:
          name: changelog-files
          path: changelog_files/

      - name: Publish release
        run: |
          REPO="${{ github.repository }}"
          CHANGELOG=$(cat changelog_files/github_changelog.txt 2>/dev/null)

          {
            echo "> [!WARNING]"
            echo "> **Experimental Build** — May contain bugs or incomplete features"
            echo ""
            [ -n "$CHANGELOG" ] && printf "%s\n\n" "$CHANGELOG"
            echo "## Installation"
            echo ""
            echo "Download and run \`HSEnhancerLauncher.exe\` — it will automatically install and update the mod."
            echo ""
            echo "<!-- LAST_NOTIFIED_COMMIT: $CURRENT_COMMIT -->"
          } > release_body.md

          gh release view experimental-latest --repo "$REPO" &>/dev/null \
            && gh release edit experimental-latest --repo "$REPO" --notes-file release_body.md \
            || gh release create experimental-latest --repo "$REPO" --title "Experimental Build" --notes-file release_body.md --prerelease

          [ "$MOD_CHANGED" = true ] && [ -f release_files/HSEnhancer.dll ] && \
            gh release upload experimental-latest release_files/HSEnhancer.dll release_files/winmm.dll release_files/HSEnhancer.zip --repo "$REPO" --clobber || true
          [ "$LAUNCHER_CHANGED" = true ] && [ -f release_files/HSEnhancerLauncher.exe ] && \
            gh release upload experimental-latest release_files/HSEnhancerLauncher.exe --repo "$REPO" --clobber || true

          # TODO(v0.7.0): Remove dev-latest migration once all users have transitioned to experimental-latest
          if gh release view dev-latest --repo "$REPO" &>/dev/null; then
            [ "$MOD_CHANGED" = true ] && [ -f release_files/HSEnhancer.dll ] && \
              gh release upload dev-latest release_files/HSEnhancer.dll release_files/winmm.dll release_files/HSEnhancer.zip --repo "$REPO" --clobber || true
            [ "$LAUNCHER_CHANGED" = true ] && [ -f release_files/HSEnhancerLauncher.exe ] && \
              gh release upload dev-latest release_files/HSEnhancerLauncher.exe --repo "$REPO" --clobber || true
          fi

      - name: Discord notification
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -z "$WEBHOOK_URL" ] && exit 0
          CHANGELOG=$(cat changelog_files/discord_changelog.txt 2>/dev/null) && [ -n "$CHANGELOG" ] || exit 0

          jq -n --arg content "<@&1426630164053360640>
          # New Experimental Build

          $CHANGELOG" --arg url "https://github.com/${{ github.repository }}/releases/tag/experimental-latest" \
            '{content: $content, components: [{type: 1, components: [{type: 2, style: 5, label: "Download", url: $url}]}]}' |
          curl -sX POST -H "Content-Type: application/json" -d @- "$WEBHOOK_URL"

      - name: Notify failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -z "$WEBHOOK_URL" ] && exit 0
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          jq -n --arg content "⚠️ **Experimental Build Failed**"$'\n\n'"View logs: <$RUN_URL>" '{content: $content}' | \
            curl -s -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK_URL"

name: Experimental

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Prepare
        shell: pwsh
        run: |
          $resource = Get-Content "Launcher/resource/Launcher.rc" -Raw
          if ($resource -notmatch 'FILEVERSION\s+(\d+),\s*(\d+),\s*(\d+)') {
            throw "Failed to read the experimental version"
          }

          $version = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          $sequence = [uint64]${{ github.run_id }} * 100 + [uint64]${{ github.run_attempt }}
          "PRODUCT_VERSION=$version" >> $env:GITHUB_ENV
          "PACKAGE_SEQUENCE=$sequence" >> $env:GITHUB_ENV
          "NEXUS_VERSION=$version-experimental.${{ github.run_number }}.${{ github.run_attempt }}" >> $env:GITHUB_ENV
          "### Experimental $version (${{ github.sha }})" >> $env:GITHUB_STEP_SUMMARY

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        shell: pwsh
        run: >-
          msbuild "Half Sword Enhancer.sln" /t:Rebuild /m
          "/p:Configuration=Release Experimental" /p:Platform=x64 /p:SkipGameInstall=true

      - name: Package
        shell: pwsh
        run: >-
          & ".\scripts\package-release.ps1"
          -Channel experimental
          -Version $env:PRODUCT_VERSION
          -BuildId "${{ github.sha }}"
          -Sequence $env:PACKAGE_SEQUENCE

      - name: Publish
        shell: pwsh
        run: |
          $repo = "${{ github.repository }}"

          gh release delete experimental-latest --repo $repo --cleanup-tag --yes *> $null

          gh release create experimental-latest "release_files/HSEnhancer.zip" `
            --repo $repo `
            --target "${{ github.sha }}" `
            --title "Experimental Build" `
            --notes "Frequently updated experimental version. It may be significantly ahead of the release version, but it is less stable." `
            --prerelease

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish the experimental release"
          }

      - name: Publish to Nexus Mods
        uses: Nexus-Mods/upload-action@19da5c91527877cd0bfedc6e6239c911035846a0 # v1.0.0-beta.9
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: 409
          filename: release_files/HSEnhancer.zip
          version: ${{ env.NEXUS_VERSION }}
          display_name: Half Sword Enhancer - Experimental
          description: Frequently updated experimental version. It may be significantly ahead of the release version, but it is less stable.
          category: main
          archive_existing_version: true
          primary_mod_manager_download: false
          allow_mod_manager_download: false
          show_requirements_pop_up: false
          update_mod_version: false
